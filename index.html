<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RoyalOak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0f1115;
      --card: #181b21;
      --border: #2b303a;

      --text: #eeeeee;
      --muted: #8f97a5;

      --blue: #6374ff;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #facc15;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(900px, calc(100% - 16px));
      margin: 12px auto 50px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    /* =========================
       TOP
    ========================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sync-btn {
      border: 0;
      border-radius: 8px;
      padding: 8px 11px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .sync-btn:disabled {
      opacity: .5;
      cursor: default;
    }

    .sync-status {
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .error-box {
      display: none;
      margin-bottom: 10px;
      padding: 9px 10px;
      border: 1px solid rgba(248, 113, 113, .35);
      background: rgba(248, 113, 113, .06);
      color: #ffb0b0;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.45;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      min-width: 0;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 15px;
      font-weight: bold;
      word-break: break-word;
    }

    .positive {
      color: var(--green);
    }

    .negative {
      color: var(--red);
    }

    /* =========================
       SECTION
    ========================= */

    .section-title {
      margin: 13px 0 6px;
      font-size: 12px;
      color: var(--muted);
    }

    /* =========================
       COMPACT TRADE CARD
    ========================= */

    .trade-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;

      padding: 6px 8px;
      margin-bottom: 5px;
    }

    .trade-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      line-height: 1;
    }

    .symbol {
      font-size: 14px;
      font-weight: bold;
    }

    .side,
    .status {
      display: inline-block;

      font-size: 8px;
      font-weight: bold;

      border-radius: 999px;

      padding: 2px 5px;
    }

    .side.long {
      color: var(--green);
      background: rgba(74, 222, 128, .08);
    }

    .side.short {
      color: var(--red);
      background: rgba(248, 113, 113, .08);
    }

    .status.open {
      color: var(--yellow);
      background: rgba(250, 204, 21, .08);
    }

    .status.win {
      color: var(--green);
      background: rgba(74, 222, 128, .08);
    }

    .status.loss {
      color: var(--red);
      background: rgba(248, 113, 113, .08);
    }

    .entry-line {
      margin-top: 3px;

      font-size: 10px;
      line-height: 1.15;

      color: var(--muted);
    }

    .compact-data {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 3px 9px;

      margin-top: 4px;
    }

    .compact-item {
      font-size: 10px;
      line-height: 1.15;
      white-space: nowrap;
    }

    .compact-label {
      color: var(--muted);
      margin-right: 2px;
    }

    .compact-value {
      font-weight: bold;
    }

    /*
      備註仍顯示，
      但 TP2 / 槓桿不再放這裡
    */
    .card-extra {
      margin-top: 4px;
      padding-top: 4px;

      border-top: 1px solid var(--border);

      color: #aeb5bf;

      font-size: 9px;
      line-height: 1.25;

      word-break: break-word;
    }

    .pnl {
      display: inline-block;

      margin-top: 4px;

      font-size: 12px;
      font-weight: bold;
      line-height: 1;
    }

    .empty {
      padding: 16px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .app {
        width: calc(100% - 12px);
        margin-top: 7px;
      }

      h1 {
        font-size: 18px;
      }

      .stat {
        padding: 8px 7px;
      }

      .stat-label {
        font-size: 9px;
      }

      .stat-value {
        font-size: 13px;
      }

      .trade-card {
        padding: 6px 7px;
        margin-bottom: 5px;
      }

      .symbol {
        font-size: 13px;
      }

      .entry-line {
        font-size: 9px;
      }

      .compact-data {
        gap: 3px 8px;
      }

      .compact-item {
        font-size: 9px;
      }

      .card-extra {
        font-size: 9px;
      }

      .pnl {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">

    <h1>RoyalOak</h1>

    <button
      id="syncButton"
      class="sync-btn"
      onclick="loadSheetTrades()"
    >
      ↻ 同步 Sheet
    </button>

  </div>


  <div
    id="syncStatus"
    class="sync-status"
  >
    尚未同步
  </div>


  <div
    id="errorBox"
    class="error-box"
  ></div>


  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        總 PNL
      </div>

      <div
        id="totalPnL"
        class="stat-value"
      >
        0 U
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        勝率
      </div>

      <div
        id="winRate"
        class="stat-value"
      >
        -
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        總筆數
      </div>

      <div
        id="totalTrades"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>


  <div class="section-title">
    未結束
  </div>

  <div id="openTrades"></div>


  <div class="section-title">
    已結束
  </div>

  <div id="closedTrades"></div>

</div>


<script>

  /*
    Google Sheet CSV
  */
  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/1tPLSXTk56Z-ylsDjz5VQ4R_30J4OFpGAVUmtxujqupE/export?format=csv&gid=0";


  let trades = [];


  /* =========================
     LOAD SHEET
  ========================= */

  async function loadSheetTrades() {

    const button =
      document.getElementById(
        "syncButton"
      );

    const status =
      document.getElementById(
        "syncStatus"
      );

    const errorBox =
      document.getElementById(
        "errorBox"
      );


    errorBox.style.display =
      "none";

    errorBox.textContent =
      "";


    button.disabled =
      true;


    status.textContent =
      "正在讀取 Google Sheet...";


    try {

      const url =
        SHEET_CSV_URL +
        (
          SHEET_CSV_URL.includes("?")
            ? "&"
            : "?"
        ) +
        "_=" +
        Date.now();


      const response =
        await fetch(
          url,
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const csvText =
        await response.text();


      const rows =
        parseCSV(
          csvText
        );


      trades =
        rowsToTrades(
          rows
        );


      render();


      status.textContent =
        "同步完成，共 " +
        trades.length +
        " 筆交易";


    } catch (error) {

      showError(
        "讀取失敗：" +
        (
          error.message ||
          String(error)
        )
      );


      status.textContent =
        "同步失敗";


    } finally {

      button.disabled =
        false;

    }

  }


  function showError(
    message
  ) {

    const errorBox =
      document.getElementById(
        "errorBox"
      );


    errorBox.textContent =
      message;


    errorBox.style.display =
      "block";

  }


  /* =========================
     CSV
  ========================= */

  function parseCSV(
    text
  ) {

    const rows = [];

    let row = [];
    let cell = "";

    let insideQuotes =
      false;


    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      const char =
        text[i];

      const next =
        text[i + 1];


      if (
        char === '"' &&
        insideQuotes &&
        next === '"'
      ) {

        cell += '"';

        i++;

        continue;

      }


      if (
        char === '"'
      ) {

        insideQuotes =
          !insideQuotes;

        continue;

      }


      if (
        char === "," &&
        !insideQuotes
      ) {

        row.push(
          cell
        );

        cell = "";

        continue;

      }


      if (
        (
          char === "\n" ||
          char === "\r"
        ) &&
        !insideQuotes
      ) {

        if (
          char === "\r" &&
          next === "\n"
        ) {

          i++;

        }


        row.push(
          cell
        );

        cell = "";


        const hasData =
          row.some(
            item =>
              String(item)
                .trim() !== ""
          );


        if (
          hasData
        ) {

          rows.push(
            row
          );

        }


        row = [];

        continue;

      }


      cell += char;

    }


    if (
      cell !== "" ||
      row.length > 0
    ) {

      row.push(
        cell
      );


      const hasData =
        row.some(
          item =>
            String(item)
              .trim() !== ""
        );


      if (
        hasData
      ) {

        rows.push(
          row
        );

      }

    }


    return rows;

  }


  /* =========================
     ROW → TRADE

     A = 交易標的
     B = 方向
     C = 進場價
     D = 止損
     E = 止盈1
     F = 止盈2
     G = 最終止盈
     H = 槓桿
     I = 狀態
     J = 結果
     K = 實際盈虧
     L = 備註
  ========================= */

  function rowsToTrades(
    rows
  ) {

    if (
      !rows ||
      rows.length === 0
    ) {

      return [];

    }


    return rows

      .map(
        (
          row,
          index
        ) => {

          const symbol =
            String(
              row[0] || ""
            )
              .trim()
              .toUpperCase();


          const sideRaw =
            String(
              row[1] || ""
            )
              .trim()
              .toUpperCase();


          const entry =
            toNumberOrNull(
              row[2]
            );


          const sl =
            toNumberOrNull(
              row[3]
            );


          const tp1 =
            toNumberOrNull(
              row[4]
            );


          const tp2 =
            toNumberOrNull(
              row[5]
            );


          const ftp =
            toNumberOrNull(
              row[6]
            );


          const leverage =
            toNumberOrNull(
              row[7]
            );


          const statusRaw =
            String(
              row[8] ||
              "OPEN"
            )
              .trim()
              .toUpperCase();


          const result =
            String(
              row[9] || ""
            )
              .trim()
              .toUpperCase();


          const pnl =
            toNumberOrNull(
              row[10]
            );


          const note =
            String(
              row[11] || ""
            )
              .trim();


          let side =
            "LONG";


          if (
            sideRaw === "SHORT" ||
            sideRaw === "空" ||
            sideRaw === "SELL"
          ) {

            side =
              "SHORT";

          }


          let status =
            "OPEN";


          if (
            statusRaw === "CLOSED" ||
            statusRaw === "CLOSE" ||
            statusRaw === "已結束" ||
            statusRaw === "平倉" ||
            statusRaw === "完全平倉"
          ) {

            status =
              "CLOSED";

          }


          return {

            id:
              index + 1,

            symbol,

            side,

            entry,

            sl,

            tp1,

            tp2,

            ftp,

            leverage,

            status,

            result,

            pnl,

            note,

            rrTP1:
              calculateRR(
                side,
                entry,
                sl,
                tp1
              ),

            rrFTP:
              calculateRR(
                side,
                entry,
                sl,
                ftp
              )

          };

        }
      )

      /*
        如果第一列是中文 title，
        entry 會無法轉成數字，
        所以自然會被排除。
      */
      .filter(
        trade =>
          trade.symbol &&
          trade.entry !== null
      );

  }


  /* =========================
     NUMBER
  ========================= */

  function toNumberOrNull(
    value
  ) {

    if (
      value === null ||
      value === undefined ||
      String(value)
        .trim() === ""
    ) {

      return null;

    }


    const normalized =
      String(value)

        .replaceAll(
          ",",
          ""
        )

        .replace(
          "x",
          ""
        )

        .replace(
          "X",
          ""
        )

        .replace(
          "+",
          ""
        )

        .trim();


    const number =
      Number(
        normalized
      );


    return Number.isFinite(
      number
    )
      ? number
      : null;

  }


  /* =========================
     RR
  ========================= */

  function calculateRR(
    side,
    entry,
    sl,
    target
  ) {

    entry =
      Number(entry);

    sl =
      Number(sl);

    target =
      Number(target);


    if (
      !entry ||
      !sl ||
      !target
    ) {

      return null;

    }


    const risk =
      Math.abs(
        entry - sl
      );


    if (
      !risk
    ) {

      return null;

    }


    const reward =
      side === "SHORT"

        ? entry - target

        : target - entry;


    return (
      reward /
      risk
    );

  }


  /* =========================
     FORMAT
  ========================= */

  function formatNumber(
    value
  ) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "-";

    }


    return Number(
      value
    )
      .toLocaleString(
        undefined,
        {
          maximumFractionDigits:
            8
        }
      );

  }


  function formatRR(
    rr
  ) {

    if (
      rr === null ||
      rr === undefined ||
      !Number.isFinite(rr)
    ) {

      return "-";

    }


    return (
      rr.toFixed(2) +
      "R"
    );

  }


  function formatPnL(
    pnl
  ) {

    if (
      pnl === null ||
      pnl === undefined
    ) {

      return "-";

    }


    const number =
      Number(
        pnl
      );


    return (
      number > 0
        ? "+"
        : ""
    ) +
    number.toFixed(2) +
    " U";

  }


  function escapeHTML(
    value
  ) {

    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================
     RESULT
  ========================= */

  function getResultText(
    result
  ) {

    const map = {

      TP1:
        "TP1",

      TP2:
        "TP2",

      FTP:
        "FTP",

      SL:
        "SL",

      MANUAL:
        "手動",

      "手動平倉":
        "手動",

      FULL:
        "完全平倉",

      "完全平倉":
        "完全平倉"

    };


    return (
      map[result] ||
      result ||
      "已結束"
    );

  }


  /* =========================
     CARD
  ========================= */

  function createTradeCard(
    trade
  ) {

    const isOpen =
      trade.status !==
      "CLOSED";


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "trade-card";


    let statusClass =
      "open";


    let statusText =
      "未結束";


    if (
      !isOpen
    ) {

      statusClass =
        Number(
          trade.pnl
        ) >= 0

          ? "win"

          : "loss";


      statusText =
        getResultText(
          trade.result
        );

    }


    /*
      下方額外區域只保留備註。

      TP2 已經移到主要列。
      槓桿已經顯示在 Entry 後面。
    */
    const noteHTML =
      trade.note

        ? `
          <div class="card-extra">
            ${escapeHTML(
              trade.note
            )}
          </div>
        `

        : "";


    card.innerHTML = `

      <div class="trade-title-row">

        <span class="symbol">
          ${escapeHTML(
            trade.symbol
          )}
        </span>


        <span
          class="
            side
            ${
              trade.side === "LONG"
                ? "long"
                : "short"
            }
          "
        >
          ${escapeHTML(
            trade.side
          )}
        </span>


        <span
          class="
            status
            ${statusClass}
          "
        >
          ${escapeHTML(
            statusText
          )}
        </span>

      </div>


      <div class="entry-line">

        Entry
        ${formatNumber(
          trade.entry
        )}

        ${
          trade.leverage !== null

            ? " · " +
              formatNumber(
                trade.leverage
              ) +
              "x"

            : ""
        }

      </div>


      <div class="compact-data">


        <div class="compact-item">

          <span class="compact-label">
            SL
          </span>

          <span class="compact-value">
            ${formatNumber(
              trade.sl
            )}
          </span>

        </div>


        <div class="compact-item">

          <span class="compact-label">
            TP1
          </span>

          <span class="compact-value">
            ${formatNumber(
              trade.tp1
            )}
          </span>

        </div>


        <div class="compact-item">

          <span class="compact-label">
            TP2
          </span>

          <span class="compact-value">
            ${formatNumber(
              trade.tp2
            )}
          </span>

        </div>


        <div class="compact-item">

          <span class="compact-label">
            FTP
          </span>

          <span class="compact-value">
            ${formatNumber(
              trade.ftp
            )}
          </span>

        </div>


        <div class="compact-item">

          <span class="compact-label">
            RR
          </span>

          <span class="compact-value">
            ${formatRR(
              trade.rrFTP
            )}
          </span>

        </div>

      </div>


      ${noteHTML}


      ${
        !isOpen &&
        trade.pnl !== null

          ? `
            <div
              class="
                pnl
                ${
                  Number(
                    trade.pnl
                  ) >= 0

                    ? "positive"

                    : "negative"
                }
              "
            >
              ${formatPnL(
                trade.pnl
              )}
            </div>
          `

          : ""
      }

    `;


    return card;

  }


  /* =========================
     RENDER
  ========================= */

  function render() {

    const openContainer =
      document.getElementById(
        "openTrades"
      );


    const closedContainer =
      document.getElementById(
        "closedTrades"
      );


    openContainer.innerHTML =
      "";


    closedContainer.innerHTML =
      "";


    const openTrades =
      trades.filter(
        trade =>
          trade.status !==
          "CLOSED"
      );


    const closedTrades =
      trades.filter(
        trade =>
          trade.status ===
          "CLOSED"
      );


    if (
      openTrades.length === 0
    ) {

      openContainer.innerHTML = `
        <div class="empty">
          目前沒有未結束交易
        </div>
      `;

    } else {

      openTrades.forEach(
        trade => {

          openContainer
            .appendChild(
              createTradeCard(
                trade
              )
            );

        }
      );

    }


    if (
      closedTrades.length === 0
    ) {

      closedContainer.innerHTML = `
        <div class="empty">
          尚無已結束交易
        </div>
      `;

    } else {

      closedTrades.forEach(
        trade => {

          closedContainer
            .appendChild(
              createTradeCard(
                trade
              )
            );

        }
      );

    }


    renderStats();

  }


  /* =========================
     STATS
  ========================= */

  function renderStats() {

    const closed =
      trades.filter(
        trade =>
          trade.status ===
          "CLOSED"
      );


    const tradesWithPnL =
      closed.filter(
        trade =>
          trade.pnl !== null
      );


    const wins =
      tradesWithPnL.filter(
        trade =>
          Number(
            trade.pnl
          ) > 0
      );


    const totalPnL =
      tradesWithPnL.reduce(
        (
          total,
          trade
        ) => {

          return (
            total +
            Number(
              trade.pnl || 0
            )
          );

        },
        0
      );


    const winRate =
      tradesWithPnL.length

        ? (
            wins.length /
            tradesWithPnL.length *
            100
          ).toFixed(1)

        : null;


    const pnlElement =
      document.getElementById(
        "totalPnL"
      );


    pnlElement.textContent =
      (
        totalPnL > 0
          ? "+"
          : ""
      ) +
      totalPnL.toFixed(2) +
      " U";


    pnlElement.className =
      "stat-value " +
      (
        totalPnL > 0

          ? "positive"

          : totalPnL < 0

            ? "negative"

            : ""
      );


    document
      .getElementById(
        "winRate"
      )
      .textContent =

        winRate === null

          ? "-"

          : winRate +
            "%";


    document
      .getElementById(
        "totalTrades"
      )
      .textContent =
        trades.length;

  }


  /*
    開頁面自動同步一次
  */
  loadSheetTrades();

</script>

</body>
</html>
