<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RoyalOak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07101d;
      --bg2: #0b1424;

      --panel: rgba(12, 23, 40, 0.94);
      --panel2: rgba(15, 29, 50, 0.92);

      --border: rgba(111, 151, 210, 0.18);
      --border-hover: rgba(71, 143, 255, 0.55);

      --text: #f4f7fb;
      --muted: #7f8da3;
      --muted2: #aeb9ca;

      --blue: #3b82f6;
      --blue2: #1d4ed8;
      --cyan: #37c8ff;

      --green: #40d7a1;
      --red: #ff6b7a;
      --yellow: #facc15;

      --shadow:
        0 14px 40px rgba(0, 0, 0, 0.28);
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;

      color: var(--text);

      font-family:
        Inter,
        Arial,
        "Microsoft JhengHei",
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(42, 99, 180, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 100% 20%,
          rgba(26, 91, 175, 0.12),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          var(--bg),
          var(--bg2)
        );
    }

    button {
      font: inherit;
    }

    .app {
      width:
        min(
          1380px,
          calc(100% - 32px)
        );

      margin:
        18px auto 50px;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 16px;

      margin-bottom: 14px;
    }

    .brand-wrap {
      display: flex;

      flex-direction: column;

      gap: 3px;
    }

    .brand {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;

      border-radius: 10px;

      display: grid;

      place-items: center;

      font-weight: 800;
      font-size: 15px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #175eea,
          #38bdf8
        );

      box-shadow:
        0 0 24px rgba(51, 147, 255, 0.28);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;

      letter-spacing: -0.5px;
    }

    .brand-sub {
      color: var(--muted);

      font-size: 11px;

      margin-left: 44px;
    }

    .top-actions {
      display: flex;

      align-items: center;

      gap: 8px;
    }

    .sync-btn {
      border:
        1px solid rgba(91, 150, 255, .3);

      border-radius: 10px;

      padding:
        9px 14px;

      color: white;

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          #315df5,
          #1d8df8
        );

      box-shadow:
        0 8px 22px rgba(31, 105, 255, .18);

      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .sync-btn:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 10px 28px rgba(31, 105, 255, .3);
    }

    .sync-btn:disabled {
      opacity: .55;

      cursor: default;

      transform: none;
    }

    .sync-status {
      color: var(--muted);

      font-size: 11px;

      margin-bottom: 12px;
    }

    .error-box {
      display: none;

      margin-bottom: 12px;

      padding:
        10px 12px;

      border:
        1px solid rgba(255, 107, 122, .3);

      border-radius: 10px;

      color: #ffbbc3;

      background:
        rgba(255, 107, 122, .07);

      font-size: 11px;
    }

    /* =========================
       OVERVIEW
    ========================= */

    .overview-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 10px;

      margin-bottom: 12px;
    }

    .overview-card {
      position: relative;

      overflow: hidden;

      min-width: 0;

      padding: 15px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(16, 31, 53, .96),
          rgba(9, 20, 35, .96)
        );

      box-shadow:
        var(--shadow);
    }

    .overview-card::before {
      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      right: -55px;
      top: -65px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(50, 145, 255, .16),
          transparent 70%
        );

      pointer-events: none;
    }

    .overview-label {
      color: var(--muted);

      font-size: 10px;

      margin-bottom: 7px;
    }

    .overview-value {
      font-size: 23px;
      font-weight: 800;

      letter-spacing: -.3px;

      word-break: break-word;
    }

    .overview-foot {
      margin-top: 5px;

      color: var(--muted);

      font-size: 9px;
    }

    .positive {
      color: var(--green);
    }

    .negative {
      color: var(--red);
    }

    /* =========================
       MAIN
    ========================= */

    .dashboard-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1.8fr)
        minmax(300px, .8fr);

      gap: 12px;

      align-items: start;
    }

    .column {
      min-width: 0;
    }

    .panel {
      border:
        1px solid var(--border);

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(13, 27, 47, .95),
          rgba(8, 18, 32, .96)
        );

      box-shadow:
        var(--shadow);

      overflow: hidden;

      margin-bottom: 12px;
    }

    .panel-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding:
        13px 14px;

      border-bottom:
        1px solid rgba(111, 151, 210, .12);
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
    }

    .panel-count {
      color: var(--muted);

      font-size: 10px;
    }

    .panel-body {
      padding: 10px;
    }

    /* =========================
       TRADE GRID
    ========================= */

    .trade-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;
    }

    .trade-card {
      position: relative;

      min-width: 0;

      padding:
        9px 10px;

      border:
        1px solid rgba(111, 151, 210, .16);

      border-radius: 11px;

      background:
        linear-gradient(
          145deg,
          rgba(16, 31, 53, .93),
          rgba(9, 20, 35, .94)
        );

      transition:
        border-color .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
    }

    .trade-card:hover {
      transform:
        translateY(-1px);

      border-color:
        var(--border-hover);

      box-shadow:
        0 8px 22px rgba(31, 98, 180, .12);
    }

    .trade-line {
      display: flex;

      align-items: center;

      flex-wrap: nowrap;

      min-width: 0;

      white-space: nowrap;

      font-size: 10px;

      line-height: 1.4;
    }

    .trade-line + .trade-line {
      margin-top: 3px;
    }

    .trade-line-1 {
      gap: 5px;
    }

    .symbol {
      font-size: 13px;
      font-weight: 800;

      letter-spacing: -.2px;
    }

    .side,
    .status {
      display: inline-flex;

      align-items: center;

      border-radius: 999px;

      padding:
        2px 5px;

      font-size: 7px;
      font-weight: 800;

      flex-shrink: 0;
    }

    .side.long {
      color: var(--green);

      background:
        rgba(64, 215, 161, .1);

      border:
        1px solid rgba(64, 215, 161, .1);
    }

    .side.short {
      color: var(--red);

      background:
        rgba(255, 107, 122, .1);

      border:
        1px solid rgba(255, 107, 122, .1);
    }

    .status.open {
      color: var(--yellow);

      background:
        rgba(250, 204, 21, .08);
    }

    .status.win {
      color: var(--green);

      background:
        rgba(64, 215, 161, .08);
    }

    .status.loss {
      color: var(--red);

      background:
        rgba(255, 107, 122, .08);
    }

    .trade-label {
      color: var(--muted);
    }

    .trade-value {
      color: var(--text);

      font-weight: 700;

      margin-left: 3px;
    }

    .trade-gap {
      width: 7px;

      flex-shrink: 0;
    }

    .trade-pnl {
      font-weight: 800;
    }

    .trade-note {
      margin-top: 6px;

      padding-top: 5px;

      border-top:
        1px solid rgba(111, 151, 210, .1);

      color: var(--muted2);

      font-size: 9px;
      line-height: 1.35;

      word-break: break-word;
    }

    /* =========================
       PERFORMANCE
    ========================= */

    .performance-wrap {
      padding: 14px;
    }

    .performance-top {
      display: flex;

      align-items: flex-end;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;
    }

    .performance-label {
      color: var(--muted);

      font-size: 9px;

      margin-bottom: 4px;
    }

    .performance-value {
      font-size: 29px;
      font-weight: 800;

      letter-spacing: -.5px;
    }

    .performance-change {
      font-size: 9px;

      color: var(--muted);

      text-align: right;
    }

    .chart-shell {
      position: relative;

      width: 100%;
      height: 190px;

      margin-top: 8px;

      border:
        1px solid rgba(111, 151, 210, .09);

      border-radius: 11px;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(7, 22, 38, .8),
          rgba(5, 15, 26, .55)
        );
    }

    #performanceCanvas {
      display: block;

      width: 100%;
      height: 100%;
    }

    .chart-tooltip {
      position: absolute;

      display: none;

      z-index: 5;

      pointer-events: none;

      min-width: 90px;

      padding:
        6px 8px;

      border:
        1px solid rgba(103, 160, 220, .25);

      border-radius: 7px;

      background:
        rgba(6, 15, 27, .94);

      box-shadow:
        0 8px 20px rgba(0, 0, 0, .35);

      font-size: 9px;

      color: var(--muted2);
    }

    .tooltip-title {
      color: var(--text);

      font-weight: 700;

      margin-bottom: 3px;
    }

    .performance-stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 6px;

      margin-top: 10px;
    }

    .performance-stat {
      padding: 8px;

      border:
        1px solid rgba(111, 151, 210, .09);

      border-radius: 8px;

      background:
        rgba(6, 15, 27, .35);
    }

    .performance-stat-label {
      color: var(--muted);

      font-size: 8px;

      margin-bottom: 3px;
    }

    .performance-stat-value {
      font-size: 12px;
      font-weight: 800;
    }

    /* =========================
       RECENT
    ========================= */

    .result-list {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }

    .result-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      padding:
        7px 8px;

      border:
        1px solid rgba(111, 151, 210, .1);

      border-radius: 8px;

      background:
        rgba(6, 15, 27, .5);

      font-size: 10px;
    }

    .result-symbol {
      font-weight: 700;
    }

    .result-meta {
      color: var(--muted);

      font-size: 9px;

      margin-top: 2px;
    }

    .result-pnl {
      font-weight: 800;

      white-space: nowrap;
    }

    .empty {
      grid-column:
        1 / -1;

      padding:
        20px 10px;

      text-align: center;

      color: var(--muted);

      font-size: 11px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 950px) {

      .overview-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .right-column {
        display: grid;

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }

      .right-column .panel {
        margin-bottom: 0;
      }

    }

    @media (max-width: 620px) {

      .app {
        width:
          calc(100% - 12px);

        margin-top: 8px;
      }

      .brand-logo {
        width: 30px;
        height: 30px;

        font-size: 13px;
      }

      .brand-name {
        font-size: 18px;
      }

      .brand-sub {
        margin-left: 40px;

        font-size: 9px;
      }

      .sync-btn {
        padding:
          8px 10px;

        font-size: 10px;
      }

      .overview-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 6px;
      }

      .overview-card {
        padding: 11px;

        border-radius: 11px;
      }

      .overview-label {
        font-size: 9px;
      }

      .overview-value {
        font-size: 17px;
      }

      .overview-foot {
        font-size: 8px;
      }

      .panel {
        border-radius: 12px;
      }

      .panel-head {
        padding:
          11px 10px;
      }

      .panel-body {
        padding: 7px;
      }

      .trade-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 5px;
      }

      .trade-card {
        padding:
          7px 6px;
      }

      .symbol {
        font-size: 10px;
      }

      .side,
      .status {
        font-size: 6px;

        padding:
          2px 4px;
      }

      .trade-line {
        font-size: 7px;
      }

      .trade-gap {
        width: 4px;
      }

      .trade-note {
        font-size: 7px;
      }

      .right-column {
        grid-template-columns: 1fr;
      }

      .performance-value {
        font-size: 24px;
      }

      .chart-shell {
        height: 170px;
      }

    }

    @media (max-width: 380px) {

      .trade-line {
        font-size: 6.5px;
      }

      .symbol {
        font-size: 9px;
      }

      .overview-value {
        font-size: 15px;
      }

    }
  </style>
</head>

<body>

<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">

    <div class="brand-wrap">

      <div class="brand">

        <div class="brand-logo">
          R
        </div>

        <div class="brand-name">
          RoyalOak
        </div>

      </div>

      <div class="brand-sub">
        Trading Journal Dashboard
      </div>

    </div>


    <div class="top-actions">

      <button
        id="syncButton"
        class="sync-btn"
        onclick="loadSheetTrades()"
      >
        ↻ 同步 Sheet
      </button>

    </div>

  </div>


  <div
    id="syncStatus"
    class="sync-status"
  >
    尚未同步
  </div>


  <div
    id="errorBox"
    class="error-box"
  ></div>


  <!-- OVERVIEW -->
  <div class="overview-grid">

    <div class="overview-card">

      <div class="overview-label">
        TOTAL PNL
      </div>

      <div
        id="totalPnL"
        class="overview-value"
      >
        0.00 U
      </div>

      <div class="overview-foot">
        已結束交易
      </div>

    </div>


    <div class="overview-card">

      <div class="overview-label">
        WIN RATE
      </div>

      <div
        id="winRate"
        class="overview-value"
      >
        -
      </div>

      <div class="overview-foot">
        勝率
      </div>

    </div>


    <div class="overview-card">

      <div class="overview-label">
        TOTAL TRADES
      </div>

      <div
        id="totalTrades"
        class="overview-value"
      >
        0
      </div>

      <div class="overview-foot">
        總交易筆數
      </div>

    </div>


    <div class="overview-card">

      <div class="overview-label">
        OPEN TRADES
      </div>

      <div
        id="openCount"
        class="overview-value"
      >
        0
      </div>

      <div class="overview-foot">
        未結束交易
      </div>

    </div>

  </div>


  <div class="dashboard-grid">

    <!-- LEFT -->
    <div class="column">

      <!-- OPEN -->
      <div class="panel">

        <div class="panel-head">

          <div class="panel-title">
            未結束交易
          </div>

          <div
            id="openLabel"
            class="panel-count"
          >
            0 筆
          </div>

        </div>


        <div class="panel-body">

          <div
            id="openTrades"
            class="trade-grid"
          ></div>

        </div>

      </div>


      <!-- CLOSED -->
      <div class="panel">

        <div class="panel-head">

          <div class="panel-title">
            已結束交易
          </div>

          <div
            id="closedLabel"
            class="panel-count"
          >
            0 筆
          </div>

        </div>


        <div class="panel-body">

          <div
            id="closedTrades"
            class="trade-grid"
          ></div>

        </div>

      </div>

    </div>


    <!-- RIGHT -->
    <div class="column right-column">

      <!-- PERFORMANCE -->
      <div class="panel">

        <div class="panel-head">

          <div class="panel-title">
            Performance
          </div>

          <div class="panel-count">
            Cumulative PNL
          </div>

        </div>


        <div class="performance-wrap">

          <div class="performance-top">

            <div>

              <div class="performance-label">
                NET PNL
              </div>

              <div
                id="performancePnL"
                class="performance-value"
              >
                0.00 U
              </div>

            </div>


            <div
              id="performanceChange"
              class="performance-change"
            >
              0 筆已結束
            </div>

          </div>


          <div
            id="chartShell"
            class="chart-shell"
          >

            <canvas
              id="performanceCanvas"
            ></canvas>


            <div
              id="chartTooltip"
              class="chart-tooltip"
            ></div>

          </div>


          <div class="performance-stats">

            <div class="performance-stat">

              <div class="performance-stat-label">
                WIN
              </div>

              <div
                id="performanceWins"
                class="
                  performance-stat-value
                  positive
                "
              >
                0
              </div>

            </div>


            <div class="performance-stat">

              <div class="performance-stat-label">
                LOSS
              </div>

              <div
                id="performanceLosses"
                class="
                  performance-stat-value
                  negative
                "
              >
                0
              </div>

            </div>


            <div class="performance-stat">

              <div class="performance-stat-label">
                WIN RATE
              </div>

              <div
                id="performanceWinRate"
                class="performance-stat-value"
              >
                -
              </div>

            </div>

          </div>

        </div>

      </div>


      <!-- RECENT -->
      <div class="panel">

        <div class="panel-head">

          <div class="panel-title">
            Recent Results
          </div>

        </div>


        <div class="panel-body">

          <div
            id="recentResults"
            class="result-list"
          ></div>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

  /*
    Google Sheet CSV
  */
  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/1tPLSXTk56Z-ylsDjz5VQ4R_30J4OFpGAVUmtxujqupE/export?format=csv&gid=0";


  let trades = [];

  let chartPoints = [];


  /* =========================
     LOAD SHEET
  ========================= */

  async function loadSheetTrades() {

    const button =
      document.getElementById(
        "syncButton"
      );


    const status =
      document.getElementById(
        "syncStatus"
      );


    const errorBox =
      document.getElementById(
        "errorBox"
      );


    errorBox.style.display =
      "none";


    errorBox.textContent =
      "";


    button.disabled =
      true;


    status.textContent =
      "正在同步 Google Sheet...";


    try {

      const url =
        SHEET_CSV_URL +
        (
          SHEET_CSV_URL.includes("?")
            ? "&"
            : "?"
        ) +
        "_=" +
        Date.now();


      const response =
        await fetch(
          url,
          {
            cache: "no-store"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const csvText =
        await response.text();


      const rows =
        parseCSV(
          csvText
        );


      trades =
        rowsToTrades(
          rows
        );


      render();


      status.textContent =
        "同步完成 · " +
        trades.length +
        " 筆交易";


    } catch (error) {

      showError(
        "讀取失敗：" +
        (
          error.message ||
          String(error)
        )
      );


      status.textContent =
        "同步失敗";


    } finally {

      button.disabled =
        false;

    }

  }


  function showError(
    message
  ) {

    const errorBox =
      document.getElementById(
        "errorBox"
      );


    errorBox.textContent =
      message;


    errorBox.style.display =
      "block";

  }


  /* =========================
     CSV
  ========================= */

  function parseCSV(
    text
  ) {

    const rows = [];

    let row = [];
    let cell = "";

    let insideQuotes =
      false;


    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      const char =
        text[i];


      const next =
        text[i + 1];


      if (
        char === '"' &&
        insideQuotes &&
        next === '"'
      ) {

        cell += '"';

        i++;

        continue;

      }


      if (
        char === '"'
      ) {

        insideQuotes =
          !insideQuotes;

        continue;

      }


      if (
        char === "," &&
        !insideQuotes
      ) {

        row.push(
          cell
        );

        cell = "";

        continue;

      }


      if (
        (
          char === "\n" ||
          char === "\r"
        ) &&
        !insideQuotes
      ) {

        if (
          char === "\r" &&
          next === "\n"
        ) {

          i++;

        }


        row.push(
          cell
        );


        cell = "";


        const hasData =
          row.some(
            value =>
              String(value)
                .trim() !== ""
          );


        if (
          hasData
        ) {

          rows.push(
            row
          );

        }


        row = [];

        continue;

      }


      cell += char;

    }


    if (
      cell !== "" ||
      row.length > 0
    ) {

      row.push(
        cell
      );


      const hasData =
        row.some(
          value =>
            String(value)
              .trim() !== ""
        );


      if (
        hasData
      ) {

        rows.push(
          row
        );

      }

    }


    return rows;

  }


  /* =========================
     ROW MAP

     A 交易標的
     B 方向
     C 進場價
     D 止損
     E 止盈1
     F 止盈2
     G 最終止盈
     H 槓桿
     I 狀態
     J 結果
     K 實際盈虧
     L 備註
  ========================= */

  function rowsToTrades(
    rows
  ) {

    return rows

      .map(
        (
          row,
          index
        ) => {

          const symbol =
            String(
              row[0] || ""
            )
              .trim()
              .toUpperCase();


          const sideRaw =
            String(
              row[1] || ""
            )
              .trim()
              .toUpperCase();


          const entry =
            toNumberOrNull(
              row[2]
            );


          const sl =
            toNumberOrNull(
              row[3]
            );


          const tp1 =
            toNumberOrNull(
              row[4]
            );


          const tp2 =
            toNumberOrNull(
              row[5]
            );


          const ftp =
            toNumberOrNull(
              row[6]
            );


          const leverage =
            toNumberOrNull(
              row[7]
            );


          const statusRaw =
            String(
              row[8] ||
              "OPEN"
            )
              .trim()
              .toUpperCase();


          const result =
            String(
              row[9] || ""
            )
              .trim()
              .toUpperCase();


          const pnl =
            toNumberOrNull(
              row[10]
            );


          const note =
            String(
              row[11] || ""
            )
              .trim();


          let side =
            "LONG";


          if (
            sideRaw === "SHORT" ||
            sideRaw === "空" ||
            sideRaw === "SELL"
          ) {

            side =
              "SHORT";

          }


          let status =
            "OPEN";


          if (
            statusRaw === "CLOSED" ||
            statusRaw === "CLOSE" ||
            statusRaw === "已結束" ||
            statusRaw === "平倉" ||
            statusRaw === "完全平倉"
          ) {

            status =
              "CLOSED";

          }


          return {

            id:
              index + 1,

            order:
              index,

            symbol,

            side,

            entry,

            sl,

            tp1,

            tp2,

            ftp,

            leverage,

            status,

            result,

            pnl,

            note,

            rrFTP:
              calculateRR(
                side,
                entry,
                sl,
                ftp
              )

          };

        }
      )

      /*
        中文標題列 Entry 不是數字
        因此自動排除
      */
      .filter(
        trade =>
          trade.symbol &&
          trade.entry !== null
      );

  }


  /* =========================
     NUMBER
  ========================= */

  function toNumberOrNull(
    value
  ) {

    if (
      value === null ||
      value === undefined ||
      String(value)
        .trim() === ""
    ) {

      return null;

    }


    const normalized =
      String(value)

        .replaceAll(
          ",",
          ""
        )

        .replace(
          "x",
          ""
        )

        .replace(
          "X",
          ""
        )

        .replace(
          "+",
          ""
        )

        .trim();


    const number =
      Number(
        normalized
      );


    return Number.isFinite(
      number
    )
      ? number
      : null;

  }


  /* =========================
     RR
  ========================= */

  function calculateRR(
    side,
    entry,
    sl,
    target
  ) {

    entry =
      Number(entry);


    sl =
      Number(sl);


    target =
      Number(target);


    if (
      !entry ||
      !sl ||
      !target
    ) {

      return null;

    }


    const risk =
      Math.abs(
        entry - sl
      );


    if (
      !risk
    ) {

      return null;

    }


    const reward =
      side === "SHORT"

        ? entry - target

        : target - entry;


    return (
      reward /
      risk
    );

  }


  /* =========================
     FORMAT
  ========================= */

  function formatNumber(
    value
  ) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "-";

    }


    return Number(
      value
    )
      .toLocaleString(
        undefined,
        {
          maximumFractionDigits:
            8
        }
      );

  }


  function formatRR(
    value
  ) {

    if (
      value === null ||
      value === undefined ||
      !Number.isFinite(value)
    ) {

      return "-";

    }


    return (
      value.toFixed(2) +
      "R"
    );

  }


  function formatPnL(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return "-";

    }


    const number =
      Number(
        value
      );


    return (
      number > 0
        ? "+"
        : ""
    ) +
    number.toFixed(2) +
    " U";

  }


  function escapeHTML(
    value
  ) {

    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================
     RESULT
  ========================= */

  function getResultText(
    result
  ) {

    const map = {

      TP1:
        "TP1",

      TP2:
        "TP2",

      FTP:
        "FTP",

      SL:
        "SL",

      MANUAL:
        "手動",

      "手動平倉":
        "手動",

      FULL:
        "完全平倉",

      "完全平倉":
        "完全平倉"

    };


    return (
      map[result] ||
      result ||
      "已結束"
    );

  }


  /* =========================
     TRADE CARD
  ========================= */

  function createTradeCard(
    trade
  ) {

    const isOpen =
      trade.status !==
      "CLOSED";


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "trade-card";


    let statusClass =
      "open";


    let statusText =
      "未結束";


    if (
      !isOpen
    ) {

      statusClass =
        Number(
          trade.pnl
        ) >= 0

          ? "win"

          : "loss";


      statusText =
        getResultText(
          trade.result
        );

    }


    card.innerHTML = `

      <div
        class="
          trade-line
          trade-line-1
        "
      >

        <span class="symbol">
          ${escapeHTML(
            trade.symbol
          )}
        </span>


        <span
          class="
            side
            ${
              trade.side === "LONG"
                ? "long"
                : "short"
            }
          "
        >
          ${escapeHTML(
            trade.side
          )}
        </span>


        <span
          class="
            status
            ${statusClass}
          "
        >
          ${escapeHTML(
            statusText
          )}
        </span>

      </div>


      <div class="trade-line">

        <span class="trade-label">
          Entry
        </span>

        <span class="trade-value">
          ${formatNumber(
            trade.entry
          )}
        </span>


        ${
          trade.leverage !== null

            ? `
              <span class="trade-gap"></span>

              <span class="trade-value">
                ${formatNumber(
                  trade.leverage
                )}x
              </span>
            `

            : ""
        }


        <span class="trade-gap"></span>


        <span class="trade-label">
          SL
        </span>

        <span class="trade-value">
          ${formatNumber(
            trade.sl
          )}
        </span>

      </div>


      <div class="trade-line">

        <span class="trade-label">
          TP1
        </span>

        <span class="trade-value">
          ${formatNumber(
            trade.tp1
          )}
        </span>


        <span class="trade-gap"></span>


        <span class="trade-label">
          TP2
        </span>

        <span class="trade-value">
          ${formatNumber(
            trade.tp2
          )}
        </span>


        <span class="trade-gap"></span>


        <span class="trade-label">
          FTP
        </span>

        <span class="trade-value">
          ${formatNumber(
            trade.ftp
          )}
        </span>

      </div>


      <div class="trade-line">

        <span class="trade-label">
          RR
        </span>

        <span class="trade-value">
          ${formatRR(
            trade.rrFTP
          )}
        </span>


        ${
          !isOpen &&
          trade.pnl !== null

            ? `
              <span class="trade-gap"></span>

              <span
                class="
                  trade-pnl
                  ${
                    Number(
                      trade.pnl
                    ) >= 0
                      ? "positive"
                      : "negative"
                  }
                "
              >
                ${formatPnL(
                  trade.pnl
                )}
              </span>
            `

            : ""
        }

      </div>


      ${
        trade.note

          ? `
            <div class="trade-note">
              ${escapeHTML(
                trade.note
              )}
            </div>
          `

          : ""
      }

    `;


    return card;

  }


  /* =========================
     RENDER
  ========================= */

  function render() {

    const openContainer =
      document.getElementById(
        "openTrades"
      );


    const closedContainer =
      document.getElementById(
        "closedTrades"
      );


    openContainer.innerHTML =
      "";


    closedContainer.innerHTML =
      "";


    const openTrades =
      trades.filter(
        trade =>
          trade.status !==
          "CLOSED"
      );


    const closedTrades =
      trades.filter(
        trade =>
          trade.status ===
          "CLOSED"
      );


    if (
      openTrades.length === 0
    ) {

      openContainer.innerHTML = `
        <div class="empty">
          目前沒有未結束交易
        </div>
      `;

    } else {

      openTrades.forEach(
        trade => {

          openContainer
            .appendChild(
              createTradeCard(
                trade
              )
            );

        }
      );

    }


    if (
      closedTrades.length === 0
    ) {

      closedContainer.innerHTML = `
        <div class="empty">
          尚無已結束交易
        </div>
      `;

    } else {

      closedTrades.forEach(
        trade => {

          closedContainer
            .appendChild(
              createTradeCard(
                trade
              )
            );

        }
      );

    }


    document
      .getElementById(
        "openLabel"
      )
      .textContent =
        openTrades.length +
        " 筆";


    document
      .getElementById(
        "closedLabel"
      )
      .textContent =
        closedTrades.length +
        " 筆";


    renderStats(
      openTrades,
      closedTrades
    );


    renderRecentResults(
      closedTrades
    );


    renderPerformanceChart(
      closedTrades
    );

  }


  /* =========================
     STATS
  ========================= */

  function renderStats(
    openTrades,
    closedTrades
  ) {

    const pnlTrades =
      closedTrades.filter(
        trade =>
          trade.pnl !== null
      );


    const wins =
      pnlTrades.filter(
        trade =>
          Number(
            trade.pnl
          ) > 0
      );


    const totalPnL =
      pnlTrades.reduce(
        (
          total,
          trade
        ) => {

          return (
            total +
            Number(
              trade.pnl || 0
            )
          );

        },
        0
      );


    const winRate =
      pnlTrades.length

        ? (
            wins.length /
            pnlTrades.length *
            100
          ).toFixed(1)

        : null;


    setPnLText(
      "totalPnL",
      totalPnL
    );


    document
      .getElementById(
        "winRate"
      )
      .textContent =
        winRate === null

          ? "-"

          : winRate +
            "%";


    document
      .getElementById(
        "totalTrades"
      )
      .textContent =
        trades.length;


    document
      .getElementById(
        "openCount"
      )
      .textContent =
        openTrades.length;

  }


  function setPnLText(
    id,
    pnl
  ) {

    const element =
      document.getElementById(
        id
      );


    element.textContent =
      (
        pnl > 0
          ? "+"
          : ""
      ) +
      pnl.toFixed(2) +
      " U";


    element.classList.remove(
      "positive",
      "negative"
    );


    if (
      pnl > 0
    ) {

      element.classList.add(
        "positive"
      );

    } else if (
      pnl < 0
    ) {

      element.classList.add(
        "negative"
      );

    }

  }


  /* =========================
     PERFORMANCE CHART
  ========================= */

  function renderPerformanceChart(
    closedTrades
  ) {

    /*
      按 Google Sheet 原本的列順序計算
      累積 PNL。
    */
    const pnlTrades =
      closedTrades
        .filter(
          trade =>
            trade.pnl !== null
        )
        .sort(
          (
            a,
            b
          ) =>
            a.order -
            b.order
        );


    const wins =
      pnlTrades.filter(
        trade =>
          Number(
            trade.pnl
          ) > 0
      );


    const losses =
      pnlTrades.filter(
        trade =>
          Number(
            trade.pnl
          ) < 0
      );


    const totalPnL =
      pnlTrades.reduce(
        (
          total,
          trade
        ) =>
          total +
          Number(
            trade.pnl || 0
          ),
        0
      );


    const winRate =
      pnlTrades.length

        ? (
            wins.length /
            pnlTrades.length *
            100
          ).toFixed(1)

        : null;


    setPnLText(
      "performancePnL",
      totalPnL
    );


    document
      .getElementById(
        "performanceChange"
      )
      .textContent =
        pnlTrades.length +
        " 筆已結束";


    document
      .getElementById(
        "performanceWins"
      )
      .textContent =
        wins.length;


    document
      .getElementById(
        "performanceLosses"
      )
      .textContent =
        losses.length;


    document
      .getElementById(
        "performanceWinRate"
      )
      .textContent =
        winRate === null
          ? "-"
          : winRate +
            "%";


    /*
      從 0 開始。
    */
    let cumulative =
      0;


    chartPoints = [

      {
        index: 0,
        value: 0,
        symbol: "START",
        pnl: 0
      }

    ];


    pnlTrades.forEach(
      (
        trade,
        index
      ) => {

        cumulative +=
          Number(
            trade.pnl || 0
          );


        chartPoints.push({

          index:
            index + 1,

          value:
            cumulative,

          symbol:
            trade.symbol,

          pnl:
            Number(
              trade.pnl || 0
            )

        });

      }
    );


    drawPerformanceChart();

  }


  function drawPerformanceChart() {

    const canvas =
      document.getElementById(
        "performanceCanvas"
      );


    const shell =
      document.getElementById(
        "chartShell"
      );


    if (
      !canvas ||
      !shell
    ) {
      return;
    }


    const rect =
      shell.getBoundingClientRect();


    const dpr =
      window.devicePixelRatio ||
      1;


    canvas.width =
      Math.max(
        1,
        Math.round(
          rect.width *
          dpr
        )
      );


    canvas.height =
      Math.max(
        1,
        Math.round(
          rect.height *
          dpr
        )
      );


    canvas.style.width =
      rect.width +
      "px";


    canvas.style.height =
      rect.height +
      "px";


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    const width =
      rect.width;


    const height =
      rect.height;


    ctx.clearRect(
      0,
      0,
      width,
      height
    );


    const padding = {
      left: 12,
      right: 12,
      top: 14,
      bottom: 18
    };


    const chartWidth =
      width -
      padding.left -
      padding.right;


    const chartHeight =
      height -
      padding.top -
      padding.bottom;


    /*
      背景水平格線
    */
    ctx.lineWidth =
      1;


    ctx.strokeStyle =
      "rgba(122, 163, 210, 0.08)";


    for (
      let i = 0;
      i <= 4;
      i++
    ) {

      const y =
        padding.top +
        chartHeight *
        (
          i / 4
        );


      ctx.beginPath();


      ctx.moveTo(
        padding.left,
        y
      );


      ctx.lineTo(
        width -
        padding.right,
        y
      );


      ctx.stroke();

    }


    /*
      垂直格線
    */
    for (
      let i = 0;
      i <= 4;
      i++
    ) {

      const x =
        padding.left +
        chartWidth *
        (
          i / 4
        );


      ctx.beginPath();


      ctx.moveTo(
        x,
        padding.top
      );


      ctx.lineTo(
        x,
        height -
        padding.bottom
      );


      ctx.stroke();

    }


    if (
      chartPoints.length <
      2
    ) {

      ctx.fillStyle =
        "rgba(127, 141, 163, .8)";


      ctx.font =
        "11px Arial";


      ctx.textAlign =
        "center";


      ctx.fillText(
        "尚無足夠交易資料",
        width / 2,
        height / 2
      );


      return;

    }


    const values =
      chartPoints.map(
        point =>
          point.value
      );


    let minValue =
      Math.min(
        ...values
      );


    let maxValue =
      Math.max(
        ...values
      );


    /*
      讓圖不會貼上下邊界。
    */
    if (
      minValue ===
      maxValue
    ) {

      minValue -=
        1;

      maxValue +=
        1;

    }


    const range =
      maxValue -
      minValue;


    const extra =
      range *
      .18;


    minValue -=
      extra;


    maxValue +=
      extra;


    function getX(index) {

      return (
        padding.left +
        (
          index /
          (
            chartPoints.length -
            1
          )
        ) *
        chartWidth
      );

    }


    function getY(value) {

      return (
        padding.top +
        (
          (
            maxValue -
            value
          ) /
          (
            maxValue -
            minValue
          )
        ) *
        chartHeight
      );

    }


    /*
      0 PNL 基準線
    */
    if (
      minValue <
      0 &&
      maxValue >
      0
    ) {

      const zeroY =
        getY(
          0
        );


      ctx.strokeStyle =
        "rgba(180, 195, 215, .14)";


      ctx.setLineDash(
        [
          4,
          4
        ]
      );


      ctx.beginPath();


      ctx.moveTo(
        padding.left,
        zeroY
      );


      ctx.lineTo(
        width -
        padding.right,
        zeroY
      );


      ctx.stroke();


      ctx.setLineDash(
        []
      );

    }


    const finalValue =
      chartPoints[
        chartPoints.length - 1
      ].value;


    const positive =
      finalValue >=
      0;


    const lineColor =
      positive

        ? "#40d7a1"

        : "#ff6b7a";


    /*
      填色區域
    */
    const gradient =
      ctx.createLinearGradient(
        0,
        padding.top,
        0,
        height -
        padding.bottom
      );


    if (
      positive
    ) {

      gradient.addColorStop(
        0,
        "rgba(64, 215, 161, .30)"
      );


      gradient.addColorStop(
        1,
        "rgba(64, 215, 161, 0)"
      );

    } else {

      gradient.addColorStop(
        0,
        "rgba(255, 107, 122, .28)"
      );


      gradient.addColorStop(
        1,
        "rgba(255, 107, 122, 0)"
      );

    }


    ctx.beginPath();


    chartPoints.forEach(
      (
        point,
        index
      ) => {

        const x =
          getX(
            index
          );


        const y =
          getY(
            point.value
          );


        if (
          index ===
          0
        ) {

          ctx.moveTo(
            x,
            y
          );

        } else {

          ctx.lineTo(
            x,
            y
          );

        }

      }
    );


    ctx.lineTo(
      getX(
        chartPoints.length -
        1
      ),
      height -
      padding.bottom
    );


    ctx.lineTo(
      getX(0),
      height -
      padding.bottom
    );


    ctx.closePath();


    ctx.fillStyle =
      gradient;


    ctx.fill();


    /*
      主線
    */
    ctx.beginPath();


    chartPoints.forEach(
      (
        point,
        index
      ) => {

        const x =
          getX(
            index
          );


        const y =
          getY(
            point.value
          );


        if (
          index ===
          0
        ) {

          ctx.moveTo(
            x,
            y
          );

        } else {

          ctx.lineTo(
            x,
            y
          );

        }

      }
    );


    ctx.strokeStyle =
      lineColor;


    ctx.lineWidth =
      2;


    ctx.lineJoin =
      "round";


    ctx.lineCap =
      "round";


    ctx.shadowColor =
      positive

        ? "rgba(64, 215, 161, .35)"

        : "rgba(255, 107, 122, .35)";


    ctx.shadowBlur =
      7;


    ctx.stroke();


    ctx.shadowBlur =
      0;


    /*
      最後一個點
    */
    const lastX =
      getX(
        chartPoints.length -
        1
      );


    const lastY =
      getY(
        finalValue
      );


    ctx.beginPath();


    ctx.arc(
      lastX,
      lastY,
      3,
      0,
      Math.PI *
      2
    );


    ctx.fillStyle =
      lineColor;


    ctx.fill();


    /*
      右上角最終 PNL
    */
    ctx.textAlign =
      "right";


    ctx.fillStyle =
      lineColor;


    ctx.font =
      "700 10px Arial";


    ctx.fillText(
      formatPnL(
        finalValue
      ),
      width -
      padding.right,
      12
    );


    /*
      儲存繪圖位置供 hover 使用
    */
    chartPoints.forEach(
      (
        point,
        index
      ) => {

        point.x =
          getX(
            index
          );


        point.y =
          getY(
            point.value
          );

      }
    );

  }


  /* =========================
     CHART TOOLTIP
  ========================= */

  function setupChartTooltip() {

    const shell =
      document.getElementById(
        "chartShell"
      );


    const tooltip =
      document.getElementById(
        "chartTooltip"
      );


    shell.addEventListener(
      "mousemove",
      function(event) {

        if (
          !chartPoints.length
        ) {

          return;

        }


        const rect =
          shell.getBoundingClientRect();


        const mouseX =
          event.clientX -
          rect.left;


        let nearest =
          null;


        let nearestDistance =
          Infinity;


        chartPoints.forEach(
          point => {

            if (
              point.x ===
              undefined
            ) {

              return;

            }


            const distance =
              Math.abs(
                mouseX -
                point.x
              );


            if (
              distance <
              nearestDistance
            ) {

              nearest =
                point;


              nearestDistance =
                distance;

            }

          }
        );


        if (
          !nearest
        ) {

          return;

        }


        tooltip.innerHTML = `

          <div class="tooltip-title">
            ${
              nearest.index === 0
                ? "起始"
                : "#" +
                  nearest.index +
                  " " +
                  escapeHTML(
                    nearest.symbol
                  )
            }
          </div>

          <div>
            累積：
            ${formatPnL(
              nearest.value
            )}
          </div>

          ${
            nearest.index > 0

              ? `
                <div>
                  本筆：
                  ${formatPnL(
                    nearest.pnl
                  )}
                </div>
              `

              : ""
          }

        `;


        tooltip.style.display =
          "block";


        const tooltipWidth =
          110;


        let left =
          nearest.x +
          8;


        if (
          left +
          tooltipWidth >
          rect.width
        ) {

          left =
            nearest.x -
            tooltipWidth -
            8;

        }


        tooltip.style.left =
          Math.max(
            4,
            left
          ) +
          "px";


        tooltip.style.top =
          Math.max(
            5,
            nearest.y -
            42
          ) +
          "px";

      }
    );


    shell.addEventListener(
      "mouseleave",
      function() {

        tooltip.style.display =
          "none";

      }
    );

  }


  /* =========================
     RECENT
  ========================= */

  function renderRecentResults(
    closedTrades
  ) {

    const container =
      document.getElementById(
        "recentResults"
      );


    container.innerHTML =
      "";


    const recent =
      closedTrades
        .slice()
        .reverse()
        .slice(
          0,
          5
        );


    if (
      recent.length === 0
    ) {

      container.innerHTML = `
        <div class="empty">
          尚無已結束交易
        </div>
      `;

      return;

    }


    recent.forEach(
      trade => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "result-row";


        row.innerHTML = `

          <div>

            <div class="result-symbol">
              ${escapeHTML(
                trade.symbol
              )}
            </div>

            <div class="result-meta">
              ${escapeHTML(
                trade.side
              )}
              ·
              ${escapeHTML(
                getResultText(
                  trade.result
                )
              )}
            </div>

          </div>


          <div
            class="
              result-pnl
              ${
                Number(
                  trade.pnl
                ) >= 0

                  ? "positive"

                  : "negative"
              }
            "
          >
            ${formatPnL(
              trade.pnl
            )}
          </div>

        `;


        container.appendChild(
          row
        );

      }
    );

  }


  /* =========================
     RESIZE
  ========================= */

  let resizeTimer =
    null;


  window.addEventListener(
    "resize",
    function() {

      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          function() {

            drawPerformanceChart();

          },
          120
        );

    }
  );


  setupChartTooltip();


  /*
    開頁面自動同步一次
  */
  loadSheetTrades();

</script>
