<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trade Journal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0f1115;
      --card: #181b21;
      --card2: #111419;
      --border: #2b303a;

      --text: #eeeeee;
      --muted: #8f97a5;

      --blue: #6374ff;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #facc15;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app {
      width: min(900px, calc(100% - 20px));
      margin: 16px auto 50px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    /* =========================
       統計
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      min-width: 0;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 17px;
      font-weight: bold;
      word-break: break-word;
    }

    .positive {
      color: var(--green);
    }

    .negative {
      color: var(--red);
    }

    /* =========================
       快速新增
    ========================= */

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .panel-header {
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .panel-header-title {
      font-size: 14px;
      font-weight: bold;
    }

    .panel-header-sub {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }

    .arrow {
      font-size: 12px;
      transition: transform .2s;
    }

    .arrow.open {
      transform: rotate(180deg);
    }

    .panel-content {
      display: none;
      padding: 0 14px 14px;
    }

    .panel-content.open {
      display: block;
    }

    .editing-banner {
      display: none;
      margin-bottom: 12px;
      padding: 9px 10px;
      background: #20283a;
      color: #b5c7ff;
      border-radius: 8px;
      font-size: 12px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      color: #b2b8c2;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #343a46;
      background: var(--card2);
      color: white;
      border-radius: 8px;
      padding: 9px 10px;
      outline: none;
      font-size: 13px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
    }

    textarea {
      min-height: 65px;
      resize: vertical;
    }

    .direction-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .direction-button {
      border: 1px solid #343a46;
      background: var(--card2);
      color: #aaa;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .direction-button.long.active {
      color: var(--green);
      border-color: var(--green);
      background: rgba(74, 222, 128, .08);
    }

    .direction-button.short.active {
      color: var(--red);
      border-color: var(--red);
      background: rgba(248, 113, 113, .08);
    }

    .more-toggle {
      display: inline-block;
      margin-top: 11px;
      font-size: 12px;
      color: #a8b2ff;
      cursor: pointer;
    }

    .more-options {
      display: none;
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid var(--border);
    }

    .more-options.open {
      display: block;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 13px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 11px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .primary {
      background: var(--blue);
      color: white;
    }

    .secondary {
      background: #292f39;
      color: white;
    }

    .danger {
      background: #51272e;
      color: #ff9aa5;
    }

    /* =========================
       區塊標題
    ========================= */

    .section-title {
      margin: 15px 0 8px;
      font-size: 12px;
      color: var(--muted);
    }

    /* =========================
       超精簡卡片
    ========================= */

    .trade-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 7px;
    }

    .trade-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .trade-main {
      min-width: 0;
    }

    .trade-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .symbol {
      font-size: 15px;
      font-weight: bold;
      word-break: break-word;
    }

    .side {
      display: inline-block;
      font-size: 9px;
      font-weight: bold;
      border-radius: 999px;
      padding: 3px 6px;
    }

    .side.long {
      color: var(--green);
      background: rgba(74, 222, 128, .08);
    }

    .side.short {
      color: var(--red);
      background: rgba(248, 113, 113, .08);
    }

    .status {
      display: inline-block;
      font-size: 9px;
      border-radius: 999px;
      padding: 3px 6px;
    }

    .status.open {
      color: var(--yellow);
      background: rgba(250, 204, 21, .08);
    }

    .status.win {
      color: var(--green);
      background: rgba(74, 222, 128, .08);
    }

    .status.loss {
      color: var(--red);
      background: rgba(248, 113, 113, .08);
    }

    .entry-line {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    .compact-data {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 12px;
      margin-top: 5px;
    }

    .compact-item {
      font-size: 11px;
      white-space: nowrap;
    }

    .compact-label {
      color: var(--muted);
      margin-right: 3px;
    }

    .compact-value {
      font-weight: bold;
    }

    .card-extra {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      color: #aeb5bf;
      font-size: 10px;
      line-height: 1.4;
      word-break: break-word;
    }

    .pnl {
      font-size: 15px;
      font-weight: bold;
      margin-top: 6px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 7px;
    }

    .card-actions.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .card-actions button {
      padding: 7px 8px;
      font-size: 11px;
    }

    /* =========================
       結算
    ========================= */

    .settle-area {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .settle-area.open {
      display: block;
    }

    .settle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .settle-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 7px;
    }

    .empty {
      padding: 18px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       手機
    ========================= */

    @media (max-width: 600px) {

      .app {
        width: calc(100% - 12px);
        margin-top: 7px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 10px;
      }

      .stats {
        gap: 5px;
      }

      .stat {
        padding: 8px 7px;
      }

      .stat-label {
        font-size: 9px;
      }

      .stat-value {
        font-size: 13px;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .form-actions {
        grid-template-columns: 1fr;
      }

      .trade-card {
        padding: 8px 9px;
        margin-bottom: 6px;
      }

      .compact-data {
        gap: 4px 9px;
      }

      .compact-item {
        font-size: 10px;
      }

      .settle-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

<div class="app">

  <h1>交易紀錄</h1>


  <!-- 統計 -->
  <div class="stats">

    <div class="stat">
      <div class="stat-label">總 PNL</div>
      <div id="totalPnL" class="stat-value">0 U</div>
    </div>

    <div class="stat">
      <div class="stat-label">勝率</div>
      <div id="winRate" class="stat-value">-</div>
    </div>

    <div class="stat">
      <div class="stat-label">總筆數</div>
      <div id="totalTrades" class="stat-value">0</div>
    </div>

  </div>


  <!-- 快速開單 -->
  <div class="panel">

    <div
      class="panel-header"
      onclick="toggleQuickForm()"
    >

      <div>
        <div class="panel-header-title">
          + 快速新增交易
        </div>

        <div
          id="formStatus"
          class="panel-header-sub"
        >
          點擊展開
        </div>
      </div>

      <div
        id="formArrow"
        class="arrow"
      >
        ▼
      </div>

    </div>


    <div
      id="quickForm"
      class="panel-content"
    >

      <div
        id="editingBanner"
        class="editing-banner"
      ></div>


      <div class="quick-grid">

        <div class="field">
          <label>交易標的</label>

          <input
            id="symbol"
            placeholder="例如 ZEC"
          >
        </div>


        <div class="field">
          <label>方向</label>

          <div class="direction-buttons">

            <button
              id="longButton"
              class="direction-button long active"
              onclick="setSide('LONG')"
              type="button"
            >
              LONG 多
            </button>

            <button
              id="shortButton"
              class="direction-button short"
              onclick="setSide('SHORT')"
              type="button"
            >
              SHORT 空
            </button>

          </div>
        </div>


        <div class="field">
          <label>進場</label>

          <input
            id="entry"
            type="number"
            step="any"
            placeholder="1510.23"
          >
        </div>


        <div class="field">
          <label>SL</label>

          <input
            id="sl"
            type="number"
            step="any"
            placeholder="1516"
          >
        </div>


        <div class="field">
          <label>TP1</label>

          <input
            id="tp1"
            type="number"
            step="any"
            placeholder="1492"
          >
        </div>


        <div class="field">
          <label>FTP</label>

          <input
            id="ftp"
            type="number"
            step="any"
            placeholder="1421.25"
          >
        </div>

      </div>


      <div
        class="more-toggle"
        onclick="toggleMoreOptions()"
      >
        + 更多設定
      </div>


      <div
        id="moreOptions"
        class="more-options"
      >

        <div class="quick-grid">

          <div class="field">
            <label>TP2</label>

            <input
              id="tp2"
              type="number"
              step="any"
              placeholder="1469"
            >
          </div>


          <div class="field">
            <label>槓桿</label>

            <input
              id="leverage"
              type="number"
              step="1"
              placeholder="50"
            >
          </div>


          <div class="field full">
            <label>進場原因 / 備註</label>

            <textarea
              id="note"
              placeholder="例如：M15 Break OB..."
            ></textarea>
          </div>

        </div>

      </div>


      <div class="form-actions">

        <button
          id="saveButton"
          class="primary"
          onclick="saveTrade()"
        >
          新增交易
        </button>

        <button
          id="cancelEditButton"
          class="secondary"
          onclick="cancelEdit()"
          style="display:none;"
        >
          取消編輯
        </button>

      </div>

    </div>

  </div>


  <div class="section-title">
    未結束
  </div>

  <div id="openTrades"></div>


  <div class="section-title">
    已結束
  </div>

  <div id="closedTrades"></div>

</div>


<script>

  let trades =
    JSON.parse(
      localStorage.getItem("tradeJournal")
    ) || [];

  let currentSide = "LONG";

  let editingId = null;

  let settlingId = null;


  function value(id) {

    return document
      .getElementById(id)
      .value;

  }


  function saveStorage() {

    localStorage.setItem(
      "tradeJournal",
      JSON.stringify(trades)
    );

  }


  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function formatNumber(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "-";
    }

    return Number(value)
      .toLocaleString(
        undefined,
        {
          maximumFractionDigits: 8
        }
      );

  }


  function formatPnL(pnl) {

    if (
      pnl === null ||
      pnl === undefined
    ) {
      return "-";
    }

    const number =
      Number(pnl);

    return (
      number > 0
        ? "+"
        : ""
    ) +
    number.toFixed(2) +
    " U";

  }


  function calculateRR(
    side,
    entry,
    sl,
    target
  ) {

    entry = Number(entry);
    sl = Number(sl);
    target = Number(target);

    if (
      !entry ||
      !sl ||
      !target
    ) {
      return null;
    }

    const risk =
      Math.abs(entry - sl);

    if (!risk) {
      return null;
    }

    let reward;

    if (side === "LONG") {

      reward =
        target - entry;

    } else {

      reward =
        entry - target;

    }

    return reward / risk;

  }


  function formatRR(rr) {

    if (
      rr === null ||
      rr === undefined ||
      !Number.isFinite(rr)
    ) {
      return "-";
    }

    return rr.toFixed(2) + "R";

  }


  /* =========================
     表單
  ========================= */

  function toggleQuickForm(
    force = null
  ) {

    const form =
      document.getElementById(
        "quickForm"
      );

    const arrow =
      document.getElementById(
        "formArrow"
      );

    const status =
      document.getElementById(
        "formStatus"
      );

    let open;

    if (force === true) {

      open = true;

    } else if (force === false) {

      open = false;

    } else {

      open =
        !form.classList.contains(
          "open"
        );

    }

    form.classList.toggle(
      "open",
      open
    );

    arrow.classList.toggle(
      "open",
      open
    );

    status.textContent =
      open
        ? "點擊收合"
        : "點擊展開";

  }


  function toggleMoreOptions(
    force = null
  ) {

    const box =
      document.getElementById(
        "moreOptions"
      );

    if (force === true) {

      box.classList.add(
        "open"
      );

    } else if (
      force === false
    ) {

      box.classList.remove(
        "open"
      );

    } else {

      box.classList.toggle(
        "open"
      );

    }

  }


  function setSide(side) {

    currentSide = side;

    document
      .getElementById(
        "longButton"
      )
      .classList
      .toggle(
        "active",
        side === "LONG"
      );

    document
      .getElementById(
        "shortButton"
      )
      .classList
      .toggle(
        "active",
        side === "SHORT"
      );

  }


  /* =========================
     新增 / 編輯
  ========================= */

  function saveTrade() {

    const symbol =
      value("symbol")
        .trim()
        .toUpperCase();

    const entry =
      Number(
        value("entry")
      );

    const sl =
      Number(
        value("sl")
      );

    const tp1 =
      Number(
        value("tp1")
      ) || null;

    const ftp =
      Number(
        value("ftp")
      ) || null;


    if (!symbol) {

      alert("請輸入交易標的");
      return;

    }


    if (!entry) {

      alert("請輸入進場價");
      return;

    }


    if (!sl) {

      alert("請輸入 SL");
      return;

    }


    const tradeData = {

      symbol,

      side:
        currentSide,

      entry,

      sl,

      tp1,

      tp2:
        Number(
          value("tp2")
        ) || null,

      ftp,

      leverage:
        Number(
          value("leverage")
        ) || null,

      note:
        value("note").trim(),

      rrTP1:
        calculateRR(
          currentSide,
          entry,
          sl,
          tp1
        ),

      rrFTP:
        calculateRR(
          currentSide,
          entry,
          sl,
          ftp
        )

    };


    if (editingId !== null) {

      const index =
        trades.findIndex(
          trade =>
            trade.id === editingId
        );

      if (index !== -1) {

        trades[index] = {
          ...trades[index],
          ...tradeData
        };

      }

    } else {

      trades.unshift({

        id:
          Date.now(),

        status:
          "OPEN",

        result:
          null,

        pnl:
          null,

        ...tradeData

      });

    }


    saveStorage();

    resetForm();

    toggleQuickForm(false);

    render();

  }


  function editTrade(id) {

    const trade =
      trades.find(
        trade =>
          trade.id === id
      );

    if (!trade) {
      return;
    }


    editingId = id;

    toggleQuickForm(true);

    setSide(
      trade.side
    );


    document
      .getElementById("symbol")
      .value =
        trade.symbol || "";


    document
      .getElementById("entry")
      .value =
        trade.entry ?? "";


    document
      .getElementById("sl")
      .value =
        trade.sl ?? "";


    document
      .getElementById("tp1")
      .value =
        trade.tp1 ?? "";


    document
      .getElementById("ftp")
      .value =
        trade.ftp ?? "";


    document
      .getElementById("tp2")
      .value =
        trade.tp2 ?? "";


    document
      .getElementById("leverage")
      .value =
        trade.leverage ?? "";


    document
      .getElementById("note")
      .value =
        trade.note || "";


    if (
      trade.tp2 ||
      trade.leverage ||
      trade.note
    ) {

      toggleMoreOptions(true);

    }


    document
      .getElementById(
        "saveButton"
      )
      .textContent =
        "更新交易";


    document
      .getElementById(
        "cancelEditButton"
      )
      .style.display =
        "block";


    const banner =
      document.getElementById(
        "editingBanner"
      );


    banner.style.display =
      "block";


    banner.textContent =
      "正在編輯：" +
      trade.symbol +
      " / " +
      trade.side;


    document
      .querySelector(".panel")
      .scrollIntoView({
        behavior: "smooth"
      });

  }


  function cancelEdit() {

    resetForm();

  }


  function resetForm() {

    editingId = null;


    document
      .getElementById("symbol")
      .value = "";


    document
      .getElementById("entry")
      .value = "";


    document
      .getElementById("sl")
      .value = "";


    document
      .getElementById("tp1")
      .value = "";


    document
      .getElementById("ftp")
      .value = "";


    document
      .getElementById("tp2")
      .value = "";


    document
      .getElementById("leverage")
      .value = "";


    document
      .getElementById("note")
      .value = "";


    setSide("LONG");

    toggleMoreOptions(false);


    document
      .getElementById(
        "saveButton"
      )
      .textContent =
        "新增交易";


    document
      .getElementById(
        "cancelEditButton"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "editingBanner"
      )
      .style.display =
        "none";

  }


  /* =========================
     結算
  ========================= */

  function toggleSettle(id) {

    settlingId =
      settlingId === id
        ? null
        : id;

    render();

  }


  function settleTrade(id) {

    const result =
      document
        .getElementById(
          "result-" + id
        )
        .value;


    const pnlInput =
      document
        .getElementById(
          "pnl-" + id
        )
        .value;


    if (pnlInput === "") {

      alert("請輸入實際盈虧");
      return;

    }


    const trade =
      trades.find(
        trade =>
          trade.id === id
      );


    if (!trade) {
      return;
    }


    trade.status =
      "CLOSED";

    trade.result =
      result;

    trade.pnl =
      Number(
        pnlInput
      );


    settlingId = null;

    saveStorage();

    render();

  }


  function reopenTrade(id) {

    const trade =
      trades.find(
        trade =>
          trade.id === id
      );


    if (!trade) {
      return;
    }


    trade.status =
      "OPEN";

    trade.result =
      null;

    trade.pnl =
      null;


    saveStorage();

    render();

  }


  function deleteTrade(id) {

    if (
      !confirm(
        "確定刪除這筆交易？"
      )
    ) {
      return;
    }


    trades =
      trades.filter(
        trade =>
          trade.id !== id
      );


    saveStorage();

    render();

  }


  /* =========================
     卡片
  ========================= */

  function createTradeCard(
    trade
  ) {

    const isOpen =
      trade.status !==
      "CLOSED";


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "trade-card";


    let statusHTML;


    if (isOpen) {

      statusHTML = `
        <span class="status open">
          未結束
        </span>
      `;

    } else if (
      Number(trade.pnl) > 0
    ) {

      statusHTML = `
        <span class="status win">
          ${escapeHTML(
            trade.result
          )}
        </span>
      `;

    } else {

      statusHTML = `
        <span class="status loss">
          ${escapeHTML(
            trade.result
          )}
        </span>
      `;

    }


    const extraParts = [];


    if (trade.tp2) {

      extraParts.push(
        "TP2 " +
        formatNumber(
          trade.tp2
        )
      );

    }


    if (trade.leverage) {

      extraParts.push(
        "槓桿 " +
        trade.leverage +
        "x"
      );

    }


    if (trade.note) {

      extraParts.push(
        "備註：" +
        escapeHTML(
          trade.note
        )
      );

    }


    const extra =
      extraParts.join(
        "<br>"
      );


    card.innerHTML = `

      <div class="trade-top">

        <div class="trade-main">

          <div class="trade-title-row">

            <span class="symbol">
              ${escapeHTML(
                trade.symbol
              )}
            </span>

            <span
              class="
                side
                ${
                  trade.side === "LONG"
                    ? "long"
                    : "short"
                }
              "
            >
              ${
                trade.side === "LONG"
                  ? "LONG"
                  : "SHORT"
              }
            </span>

            ${statusHTML}

          </div>


          <div class="entry-line">
            Entry
            ${formatNumber(
              trade.entry
            )}
          </div>

        </div>

      </div>


      <div class="compact-data">

        <div class="compact-item">
          <span class="compact-label">
            SL
          </span>

          <span class="compact-value">
            ${formatNumber(
              trade.sl
            )}
          </span>
        </div>


        <div class="compact-item">
          <span class="compact-label">
            TP1
          </span>

          <span class="compact-value">
            ${formatNumber(
              trade.tp1
            )}
          </span>
        </div>


        <div class="compact-item">
          <span class="compact-label">
            FTP
          </span>

          <span class="compact-value">
            ${formatNumber(
              trade.ftp
            )}
          </span>
        </div>


        <div class="compact-item">
          <span class="compact-label">
            RR
          </span>

          <span class="compact-value">
            ${formatRR(
              trade.rrFTP
            )}
          </span>
        </div>

      </div>


      ${
        extra
          ? `
            <div class="card-extra">
              ${extra}
            </div>
          `
          : ""
      }


      ${
        !isOpen
          ? `
            <div
              class="
                pnl
                ${
                  Number(trade.pnl) >= 0
                    ? "positive"
                    : "negative"
                }
              "
            >
              ${formatPnL(
                trade.pnl
              )}
            </div>
          `
          : ""
      }


      ${
        isOpen
          ? openCardActions(
              trade
            )
          : closedCardActions(
              trade
            )
      }

    `;


    return card;

  }


  function openCardActions(
    trade
  ) {

    const settleOpen =
      settlingId === trade.id;


    return `

      <div class="card-actions">

        <button
          class="primary"
          onclick="toggleSettle(${trade.id})"
        >
          結算
        </button>

        <button
          class="secondary"
          onclick="editTrade(${trade.id})"
        >
          編輯
        </button>

      </div>


      <div
        class="
          settle-area
          ${settleOpen ? "open" : ""}
        "
      >

        <div class="settle-grid">

          <div class="field">

            <label>
              結果
            </label>

            <select
              id="result-${trade.id}"
            >

              <option value="TP1">
                TP1
              </option>

              <option value="TP2">
                TP2
              </option>

              <option value="FTP">
                FTP
              </option>

              <option value="SL">
                SL
              </option>

              <option value="MANUAL">
                手動平倉
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              實際盈虧 USDT
            </label>

            <input
              id="pnl-${trade.id}"
              type="number"
              step="any"
              placeholder="+35 / -20"
            >

          </div>

        </div>


        <div class="settle-actions">

          <button
            class="primary"
            onclick="settleTrade(${trade.id})"
          >
            完成結算
          </button>

          <button
            class="secondary"
            onclick="toggleSettle(${trade.id})"
          >
            取消
          </button>

        </div>

      </div>

    `;

  }


  function closedCardActions(
    trade
  ) {

    return `

      <div class="card-actions three">

        <button
          class="secondary"
          onclick="editTrade(${trade.id})"
        >
          編輯
        </button>

        <button
          class="secondary"
          onclick="reopenTrade(${trade.id})"
        >
          重開
        </button>

        <button
          class="danger"
          onclick="deleteTrade(${trade.id})"
        >
          刪除
        </button>

      </div>

    `;

  }


  /* =========================
     Render
  ========================= */

  function render() {

    const openContainer =
      document.getElementById(
        "openTrades"
      );


    const closedContainer =
      document.getElementById(
        "closedTrades"
      );


    openContainer.innerHTML =
      "";

    closedContainer.innerHTML =
      "";


    const open =
      trades.filter(
        trade =>
          trade.status !==
          "CLOSED"
      );


    const closed =
      trades.filter(
        trade =>
          trade.status ===
          "CLOSED"
      );


    if (!open.length) {

      openContainer.innerHTML = `
        <div class="empty">
          目前沒有未結束交易
        </div>
      `;

    } else {

      open.forEach(
        trade => {

          openContainer.appendChild(
            createTradeCard(
              trade
            )
          );

        }
      );

    }


    if (!closed.length) {

      closedContainer.innerHTML = `
        <div class="empty">
          尚無已結束交易
        </div>
      `;

    } else {

      closed.forEach(
        trade => {

          closedContainer.appendChild(
            createTradeCard(
              trade
            )
          );

        }
      );

    }


    renderStats();

  }


  function renderStats() {

    const closed =
      trades.filter(
        trade =>
          trade.status ===
          "CLOSED"
      );


    const wins =
      closed.filter(
        trade =>
          Number(trade.pnl) > 0
      );


    const totalPnL =
      closed.reduce(
        (
          total,
          trade
        ) => {

          return (
            total +
            Number(
              trade.pnl || 0
            )
          );

        },
        0
      );


    const winRate =
      closed.length
        ? (
            wins.length /
            closed.length *
            100
          ).toFixed(1)
        : null;


    const pnl =
      document.getElementById(
        "totalPnL"
      );


    pnl.textContent =
      (
        totalPnL > 0
          ? "+"
          : ""
      ) +
      totalPnL.toFixed(2) +
      " U";


    pnl.className =
      "stat-value " +
      (
        totalPnL > 0
          ? "positive"
          : totalPnL < 0
            ? "negative"
            : ""
      );


    document
      .getElementById(
        "winRate"
      )
      .textContent =
        winRate === null
          ? "-"
          : winRate + "%";


    document
      .getElementById(
        "totalTrades"
      )
      .textContent =
        trades.length;

  }


  render();

</script>

</body>
</html>
