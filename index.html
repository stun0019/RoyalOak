<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RoyalOak</title>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --bg: #0f1115;
      --card: #181b21;
      --card2: #111419;
      --border: #2b303a;

      --text: #eeeeee;
      --muted: #8f97a5;

      --blue: #6374ff;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #facc15;

    }

    body {

      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    }

    button,
    input,
    select,
    textarea {

      font: inherit;

    }

    .app {

      width:
        min(
          900px,
          calc(100% - 20px)
        );

      margin:
        16px auto 50px;

    }

    h1 {

      margin:
        0 0 14px;

      font-size:
        22px;

    }


    /* =========================
       統計
    ========================= */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-bottom:
        12px;

    }

    .stat {

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        10px;

      padding:
        11px;

      min-width:
        0;

    }

    .stat-label {

      font-size:
        11px;

      color:
        var(--muted);

      margin-bottom:
        4px;

    }

    .stat-value {

      font-size:
        17px;

      font-weight:
        bold;

      word-break:
        break-word;

    }

    .positive {
      color: var(--green);
    }

    .negative {
      color: var(--red);
    }


    /* =========================
       頂部操作
    ========================= */

    .top-actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 7px;

      margin-bottom:
        12px;

    }

    button {

      border: 0;

      border-radius:
        8px;

      padding:
        9px 11px;

      cursor:
        pointer;

      font-weight:
        bold;

      font-size:
        12px;

    }

    .primary {

      background:
        var(--blue);

      color:
        white;

    }

    .secondary {

      background:
        #292f39;

      color:
        white;

    }

    .danger {

      background:
        #51272e;

      color:
        #ff9aa5;

    }


    /* =========================
       BingX Sync
    ========================= */

    .sync-panel {

      display:
        none;

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        10px;

      padding:
        10px;

      margin-bottom:
        12px;

    }

    .sync-panel.open {

      display:
        block;

    }

    .sync-status {

      font-size:
        11px;

      color:
        var(--muted);

      margin-bottom:
        8px;

    }

    .bingx-position {

      border:
        1px solid var(--border);

      background:
        var(--card2);

      border-radius:
        8px;

      padding:
        9px;

      margin-bottom:
        6px;

    }

    .bingx-position:last-child {

      margin-bottom:
        0;

    }

    .bingx-position-top {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        8px;

    }

    .bingx-symbol {

      font-size:
        13px;

      font-weight:
        bold;

    }

    .bingx-side {

      font-size:
        10px;

      font-weight:
        bold;

    }

    .bingx-side.long {
      color: var(--green);
    }

    .bingx-side.short {
      color: var(--red);
    }

    .bingx-info {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        4px 10px;

      margin-top:
        6px;

      font-size:
        10px;

      color:
        var(--muted);

    }

    .bingx-position-actions {

      margin-top:
        7px;

    }

    .bingx-position-actions button {

      width:
        100%;

      padding:
        7px;

    }


    /* =========================
       新增表單
    ========================= */

    .panel {

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        11px;

      margin-bottom:
        14px;

      overflow:
        hidden;

    }

    .panel-header {

      padding:
        13px 14px;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      cursor:
        pointer;

      user-select:
        none;

    }

    .panel-header-title {

      font-size:
        14px;

      font-weight:
        bold;

    }

    .panel-header-sub {

      margin-top:
        3px;

      font-size:
        11px;

      color:
        var(--muted);

    }

    .arrow {

      font-size:
        12px;

      transition:
        transform .2s;

    }

    .arrow.open {

      transform:
        rotate(180deg);

    }

    .panel-content {

      display:
        none;

      padding:
        0 14px 14px;

    }

    .panel-content.open {

      display:
        block;

    }

    .editing-banner {

      display:
        none;

      margin-bottom:
        12px;

      padding:
        9px 10px;

      background:
        #20283a;

      color:
        #b5c7ff;

      border-radius:
        8px;

      font-size:
        12px;

    }

    .quick-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap:
        10px;

    }

    .field {

      min-width:
        0;

    }

    .field.full {

      grid-column:
        1 / -1;

    }

    label {

      display:
        block;

      margin-bottom:
        5px;

      font-size:
        11px;

      color:
        #b2b8c2;

    }

    input,
    select,
    textarea {

      width:
        100%;

      border:
        1px solid #343a46;

      background:
        var(--card2);

      color:
        white;

      border-radius:
        8px;

      padding:
        9px 10px;

      outline:
        none;

      font-size:
        13px;

    }

    textarea {

      min-height:
        65px;

      resize:
        vertical;

    }

    .direction-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        6px;

    }

    .direction-button {

      border:
        1px solid #343a46;

      background:
        var(--card2);

      color:
        #aaa;

      padding:
        9px;

    }

    .direction-button.long.active {

      color:
        var(--green);

      border-color:
        var(--green);

    }

    .direction-button.short.active {

      color:
        var(--red);

      border-color:
        var(--red);

    }

    .more-toggle {

      display:
        inline-block;

      margin-top:
        11px;

      font-size:
        12px;

      color:
        #a8b2ff;

      cursor:
        pointer;

    }

    .more-options {

      display:
        none;

      margin-top:
        11px;

      padding-top:
        11px;

      border-top:
        1px solid var(--border);

    }

    .more-options.open {

      display:
        block;

    }

    .form-actions {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        7px;

      margin-top:
        13px;

    }


    /* =========================
       卡片
    ========================= */

    .section-title {

      margin:
        15px 0 8px;

      font-size:
        12px;

      color:
        var(--muted);

    }

    .trade-card {

      background:
        var(--card);

      border:
        1px solid var(--border);

      border-radius:
        10px;

      padding:
        9px 10px;

      margin-bottom:
        7px;

    }

    .trade-title-row {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      flex-wrap:
        wrap;

    }

    .symbol {

      font-size:
        15px;

      font-weight:
        bold;

    }

    .side,
    .status {

      display:
        inline-block;

      font-size:
        9px;

      font-weight:
        bold;

      border-radius:
        999px;

      padding:
        3px 6px;

    }

    .side.long {
      color: var(--green);
    }

    .side.short {
      color: var(--red);
    }

    .status.open {
      color: var(--yellow);
    }

    .status.win {
      color: var(--green);
    }

    .status.loss {
      color: var(--red);
    }

    .entry-line {

      margin-top:
        3px;

      font-size:
        11px;

      color:
        var(--muted);

    }

    .compact-data {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        5px 12px;

      margin-top:
        6px;

    }

    .compact-item {

      font-size:
        11px;

      white-space:
        nowrap;

    }

    .compact-label {

      color:
        var(--muted);

      margin-right:
        3px;

    }

    .compact-value {

      font-weight:
        bold;

    }

    .card-extra {

      margin-top:
        6px;

      padding-top:
        6px;

      border-top:
        1px solid var(--border);

      color:
        #aeb5bf;

      font-size:
        10px;

      line-height:
        1.4;

    }

    .pnl {

      font-size:
        15px;

      font-weight:
        bold;

      margin-top:
        6px;

    }

    .card-actions {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        6px;

      margin-top:
        7px;

    }

    .card-actions.three {

      grid-template-columns:
        repeat(3, 1fr);

    }

    .settle-area {

      display:
        none;

      margin-top:
        8px;

      padding-top:
        8px;

      border-top:
        1px solid var(--border);

    }

    .settle-area.open {

      display:
        block;

    }

    .settle-grid {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        7px;

    }

    .settle-actions {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        6px;

      margin-top:
        7px;

    }

    .empty {

      padding:
        18px 10px;

      text-align:
        center;

      color:
        var(--muted);

      font-size:
        12px;

    }


    @media (
      max-width: 600px
    ) {

      .app {

        width:
          calc(100% - 12px);

        margin-top:
          7px;

      }

      h1 {

        font-size:
          18px;

      }

      .stats {

        gap:
          5px;

      }

      .stat {

        padding:
          8px 7px;

      }

      .stat-label {

        font-size:
          9px;

      }

      .stat-value {

        font-size:
          13px;

      }

      .quick-grid {

        grid-template-columns:
          1fr;

      }

      .form-actions {

        grid-template-columns:
          1fr;

      }

      .settle-grid {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>


<body>

<div class="app">

  <h1>RoyalOak</h1>


  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        總 PNL
      </div>

      <div
        id="totalPnL"
        class="stat-value"
      >
        0 U
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        勝率
      </div>

      <div
        id="winRate"
        class="stat-value"
      >
        -
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        總筆數
      </div>

      <div
        id="totalTrades"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>


  <div class="top-actions">

    <button
      class="primary"
      onclick="toggleQuickForm(true)"
    >
      + 快速新增
    </button>


    <button
      id="syncButton"
      class="secondary"
      onclick="syncBingX()"
    >
      ↻ 同步 BingX
    </button>

  </div>


  <div
    id="syncPanel"
    class="sync-panel"
  >

    <div
      id="syncStatus"
      class="sync-status"
    >
      尚未同步
    </div>

    <div id="bingxPositions">
    </div>

  </div>


  <div class="panel">

    <div
      class="panel-header"
      onclick="toggleQuickForm()"
    >

      <div>

        <div class="panel-header-title">
          快速新增交易
        </div>

        <div
          id="formStatus"
          class="panel-header-sub"
        >
          點擊展開
        </div>

      </div>


      <div
        id="formArrow"
        class="arrow"
      >
        ▼
      </div>

    </div>


    <div
      id="quickForm"
      class="panel-content"
    >

      <div
        id="editingBanner"
        class="editing-banner"
      ></div>


      <div class="quick-grid">

        <div class="field">

          <label>
            交易標的
          </label>

          <input
            id="symbol"
            placeholder="ZEC"
          >

        </div>


        <div class="field">

          <label>
            方向
          </label>

          <div class="direction-buttons">

            <button
              id="longButton"
              class="
                direction-button
                long
                active
              "
              onclick="
                setSide('LONG')
              "
              type="button"
            >
              LONG
            </button>


            <button
              id="shortButton"
              class="
                direction-button
                short
              "
              onclick="
                setSide('SHORT')
              "
              type="button"
            >
              SHORT
            </button>

          </div>

        </div>


        <div class="field">

          <label>
            Entry
          </label>

          <input
            id="entry"
            type="number"
            step="any"
          >

        </div>


        <div class="field">

          <label>
            SL
          </label>

          <input
            id="sl"
            type="number"
            step="any"
          >

        </div>


        <div class="field">

          <label>
            TP1
          </label>

          <input
            id="tp1"
            type="number"
            step="any"
          >

        </div>


        <div class="field">

          <label>
            FTP
          </label>

          <input
            id="ftp"
            type="number"
            step="any"
          >

        </div>

      </div>


      <div
        class="more-toggle"
        onclick="toggleMoreOptions()"
      >
        + 更多設定
      </div>


      <div
        id="moreOptions"
        class="more-options"
      >

        <div class="quick-grid">

          <div class="field">

            <label>
              TP2
            </label>

            <input
              id="tp2"
              type="number"
              step="any"
            >

          </div>


          <div class="field">

            <label>
              槓桿
            </label>

            <input
              id="leverage"
              type="number"
              step="1"
            >

          </div>


          <div class="field full">

            <label>
              備註
            </label>

            <textarea
              id="note"
            ></textarea>

          </div>

        </div>

      </div>


      <div class="form-actions">

        <button
          id="saveButton"
          class="primary"
          onclick="saveTrade()"
        >
          新增交易
        </button>


        <button
          id="cancelEditButton"
          class="secondary"
          onclick="cancelEdit()"
          style="display:none;"
        >
          取消編輯
        </button>

      </div>

    </div>

  </div>


  <div class="section-title">
    未結束
  </div>

  <div id="openTrades">
  </div>


  <div class="section-title">
    已結束
  </div>

  <div id="closedTrades">
  </div>

</div>


<script>

  /*
    改成你的 Google Apps Script
    Web App /exec URL
  */
  const BINGX_SYNC_URL =
    "https://script.google.com/macros/s/你的部署ID/exec";


  let trades =
    JSON.parse(
      localStorage.getItem(
        "tradeJournal"
      )
    ) || [];


  let currentSide =
    "LONG";

  let editingId =
    null;

  let settlingId =
    null;


  /* =========================
     BingX 同步
  ========================= */

  function syncBingX() {

    if (
      !BINGX_SYNC_URL ||
      BINGX_SYNC_URL.includes(
        "你的部署ID"
      )
    ) {

      alert(
        "請先設定 BINGX_SYNC_URL"
      );

      return;

    }


    const panel =
      document.getElementById(
        "syncPanel"
      );

    const status =
      document.getElementById(
        "syncStatus"
      );

    const button =
      document.getElementById(
        "syncButton"
      );


    panel.classList.add(
      "open"
    );


    status.textContent =
      "正在同步 BingX...";


    button.disabled =
      true;


    const callbackName =
      "bingxCallback_" +
      Date.now();


    const script =
      document.createElement(
        "script"
      );


    const timeout =
      setTimeout(
        function() {

          cleanup();

          status.textContent =
            "同步逾時";

          button.disabled =
            false;

        },
        15000
      );


    window[callbackName] =
      function(data) {

        clearTimeout(
          timeout
        );


        cleanup();


        button.disabled =
          false;


        if (
          !data ||
          !data.success
        ) {

          status.textContent =
            "同步失敗：" +
            (
              data?.message ||
              "未知錯誤"
            );

          return;

        }


        const positions =
          Array.isArray(
            data.positions
          )
            ? data.positions
            : [];


        status.textContent =
          "找到 " +
          positions.length +
          " 筆未平倉持倉";


        renderBingXPositions(
          positions
        );

      };


    function cleanup() {

      try {

        delete window[
          callbackName
        ];

      } catch (e) {

      }


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }

    }


    script.onerror =
      function() {

        clearTimeout(
          timeout
        );


        cleanup();


        button.disabled =
          false;


        status.textContent =
          "同步失敗：無法連線 Apps Script";

      };


    script.src =
      BINGX_SYNC_URL +
      "?callback=" +
      encodeURIComponent(
        callbackName
      ) +
      "&_=" +
      Date.now();


    document.body.appendChild(
      script
    );

  }


  function renderBingXPositions(
    positions
  ) {

    const container =
      document.getElementById(
        "bingxPositions"
      );


    container.innerHTML =
      "";


    if (
      positions.length === 0
    ) {

      container.innerHTML = `
        <div class="empty">
          BingX 目前沒有未平倉持倉
        </div>
      `;

      return;

    }


    positions.forEach(
      function(position) {

        const exists =
          trades.some(
            function(trade) {

              return (
                trade.status !==
                  "CLOSED" &&
                trade.bingxPositionId &&
                String(
                  trade.bingxPositionId
                ) ===
                String(
                  position.positionId
                )
              );

            }
          );


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "bingx-position";


        row.innerHTML = `

          <div class="
            bingx-position-top
          ">

            <div class="
              bingx-symbol
            ">
              ${escapeHTML(
                normalizeSymbol(
                  position.symbol
                )
              )}
            </div>


            <div
              class="
                bingx-side
                ${
                  position.side ===
                  "LONG"
                    ? "long"
                    : "short"
                }
              "
            >
              ${escapeHTML(
                position.side
              )}
            </div>

          </div>


          <div class="
            bingx-info
          ">

            <span>
              Entry
              ${formatNumber(
                position.entryPrice
              )}
            </span>

            <span>
              ${formatNumber(
                position.leverage
              )}x
            </span>

            <span>
              Qty
              ${formatNumber(
                position.quantity
              )}
            </span>

            <span
              class="${
                Number(
                  position.unrealizedPnL
                ) >= 0
                  ? "positive"
                  : "negative"
              }"
            >
              uPNL
              ${formatPnL(
                position.unrealizedPnL
              )}
            </span>

          </div>


          <div class="
            bingx-position-actions
          ">

            <button
              class="${
                exists
                  ? "secondary"
                  : "primary"
              }"
              ${
                exists
                  ? "disabled"
                  : ""
              }
              onclick='importBingXPosition(
                ${JSON.stringify(
                  position
                )}
              )'
            >
              ${
                exists
                  ? "已匯入"
                  : "匯入"
              }
            </button>

          </div>

        `;


        container.appendChild(
          row
        );

      }
    );

  }


  function importBingXPosition(
    position
  ) {

    const exists =
      trades.some(
        function(trade) {

          return (
            trade.status !==
              "CLOSED" &&
            trade.bingxPositionId &&
            String(
              trade.bingxPositionId
            ) ===
            String(
              position.positionId
            )
          );

        }
      );


    if (exists) {

      alert(
        "這筆 BingX 持倉已經匯入"
      );

      return;

    }


    const symbol =
      normalizeSymbol(
        position.symbol
      );


    trades.unshift({

      id:
        Date.now(),

      bingxPositionId:
        String(
          position.positionId ||
          ""
        ),

      source:
        "BINGX",

      symbol:
        symbol,

      side:
        String(
          position.side ||
          "LONG"
        ).toUpperCase(),

      entry:
        Number(
          position.entryPrice ||
          0
        ),

      sl:
        null,

      tp1:
        null,

      tp2:
        null,

      ftp:
        null,

      leverage:
        Number(
          position.leverage ||
          0
        ),

      quantity:
        Number(
          position.quantity ||
          0
        ),

      unrealizedPnL:
        Number(
          position.unrealizedPnL ||
          0
        ),

      note:
        "",

      rrTP1:
        null,

      rrFTP:
        null,

      status:
        "OPEN",

      result:
        null,

      pnl:
        null

    });


    saveStorage();

    render();


    syncBingX();

  }


  function normalizeSymbol(
    symbol
  ) {

    return String(
      symbol || ""
    )
      .replace(
        "-USDT",
        ""
      )
      .replace(
        "/USDT",
        ""
      )
      .replace(
        "USDT",
        ""
      )
      .toUpperCase();

  }


  /* =========================
     基本功能
  ========================= */

  function value(id) {

    return document
      .getElementById(id)
      .value;

  }


  function saveStorage() {

    localStorage.setItem(
      "tradeJournal",
      JSON.stringify(
        trades
      )
    );

  }


  function escapeHTML(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function formatNumber(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "-";

    }


    return Number(
      value
    ).toLocaleString(
      undefined,
      {
        maximumFractionDigits:
          8
      }
    );

  }


  function formatPnL(pnl) {

    if (
      pnl === null ||
      pnl === undefined
    ) {

      return "-";

    }


    const number =
      Number(pnl);


    return (
      number > 0
        ? "+"
        : ""
    ) +
    number.toFixed(2) +
    " U";

  }


  function calculateRR(
    side,
    entry,
    sl,
    target
  ) {

    entry =
      Number(entry);

    sl =
      Number(sl);

    target =
      Number(target);


    if (
      !entry ||
      !sl ||
      !target
    ) {

      return null;

    }


    const risk =
      Math.abs(
        entry - sl
      );


    if (!risk) {

      return null;

    }


    const reward =
      side === "LONG"
        ? target - entry
        : entry - target;


    return (
      reward /
      risk
    );

  }


  function formatRR(rr) {

    if (
      rr === null ||
      rr === undefined ||
      !Number.isFinite(rr)
    ) {

      return "-";

    }


    return (
      rr.toFixed(2) +
      "R"
    );

  }


  /* =========================
     Form
  ========================= */

  function toggleQuickForm(
    force = null
  ) {

    const form =
      document.getElementById(
        "quickForm"
      );

    const arrow =
      document.getElementById(
        "formArrow"
      );

    const status =
      document.getElementById(
        "formStatus"
      );


    let open;


    if (
      force === true
    ) {

      open = true;

    } else if (
      force === false
    ) {

      open = false;

    } else {

      open =
        !form.classList
          .contains(
            "open"
          );

    }


    form.classList.toggle(
      "open",
      open
    );


    arrow.classList.toggle(
      "open",
      open
    );


    status.textContent =
      open
        ? "點擊收合"
        : "點擊展開";

  }


  function toggleMoreOptions(
    force = null
  ) {

    const box =
      document.getElementById(
        "moreOptions"
      );


    if (
      force === true
    ) {

      box.classList.add(
        "open"
      );

    } else if (
      force === false
    ) {

      box.classList.remove(
        "open"
      );

    } else {

      box.classList.toggle(
        "open"
      );

    }

  }


  function setSide(side) {

    currentSide =
      side;


    document
      .getElementById(
        "longButton"
      )
      .classList.toggle(
        "active",
        side === "LONG"
      );


    document
      .getElementById(
        "shortButton"
      )
      .classList.toggle(
        "active",
        side === "SHORT"
      );

  }


  function saveTrade() {

    const symbol =
      value("symbol")
        .trim()
        .toUpperCase();


    const entry =
      Number(
        value("entry")
      );


    const sl =
      Number(
        value("sl")
      );


    const tp1 =
      Number(
        value("tp1")
      ) || null;


    const ftp =
      Number(
        value("ftp")
      ) || null;


    if (!symbol) {

      alert(
        "請輸入交易標的"
      );

      return;

    }


    if (!entry) {

      alert(
        "請輸入 Entry"
      );

      return;

    }


    const tradeData = {

      symbol,

      side:
        currentSide,

      entry,

      sl:
        sl || null,

      tp1,

      tp2:
        Number(
          value("tp2")
        ) || null,

      ftp,

      leverage:
        Number(
          value("leverage")
        ) || null,

      note:
        value("note")
          .trim(),

      rrTP1:
        calculateRR(
          currentSide,
          entry,
          sl,
          tp1
        ),

      rrFTP:
        calculateRR(
          currentSide,
          entry,
          sl,
          ftp
        )

    };


    if (
      editingId !== null
    ) {

      const index =
        trades.findIndex(
          trade =>
            trade.id ===
            editingId
        );


      if (
        index !== -1
      ) {

        trades[index] = {
          ...trades[index],
          ...tradeData
        };

      }

    } else {

      trades.unshift({

        id:
          Date.now(),

        source:
          "MANUAL",

        status:
          "OPEN",

        result:
          null,

        pnl:
          null,

        ...tradeData

      });

    }


    saveStorage();

    resetForm();

    toggleQuickForm(
      false
    );

    render();

  }


  function editTrade(id) {

    const trade =
      trades.find(
        trade =>
          trade.id === id
      );


    if (!trade) {
      return;
    }


    editingId =
      id;


    toggleQuickForm(
      true
    );


    setSide(
      trade.side
    );


    document
      .getElementById(
        "symbol"
      )
      .value =
        trade.symbol ||
        "";


    document
      .getElementById(
        "entry"
      )
      .value =
        trade.entry ??
        "";


    document
      .getElementById(
        "sl"
      )
      .value =
        trade.sl ??
        "";


    document
      .getElementById(
        "tp1"
      )
      .value =
        trade.tp1 ??
        "";


    document
      .getElementById(
        "ftp"
      )
      .value =
        trade.ftp ??
        "";


    document
      .getElementById(
        "tp2"
      )
      .value =
        trade.tp2 ??
        "";


    document
      .getElementById(
        "leverage"
      )
      .value =
        trade.leverage ??
        "";


    document
      .getElementById(
        "note"
      )
      .value =
        trade.note ||
        "";


    document
      .getElementById(
        "saveButton"
      )
      .textContent =
        "更新交易";


    document
      .getElementById(
        "cancelEditButton"
      )
      .style.display =
        "block";


    const banner =
      document
        .getElementById(
          "editingBanner"
        );


    banner.style.display =
      "block";


    banner.textContent =
      "正在編輯：" +
      trade.symbol +
      " / " +
      trade.side;


    if (
      trade.tp2 ||
      trade.leverage ||
      trade.note
    ) {

      toggleMoreOptions(
        true
      );

    }

  }


  function cancelEdit() {

    resetForm();

  }


  function resetForm() {

    editingId =
      null;


    [
      "symbol",
      "entry",
      "sl",
      "tp1",
      "ftp",
      "tp2",
      "leverage",
      "note"
    ].forEach(
      function(id) {

        document
          .getElementById(id)
          .value =
            "";

      }
    );


    setSide(
      "LONG"
    );


    toggleMoreOptions(
      false
    );


    document
      .getElementById(
        "saveButton"
      )
      .textContent =
        "新增交易";


    document
      .getElementById(
        "cancelEditButton"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "editingBanner"
      )
      .style.display =
        "none";

  }


  /* =========================
     結算
  ========================= */

  function toggleSettle(id) {

    settlingId =
      settlingId === id
        ? null
        : id;


    render();

  }


  function settleTrade(id) {

    const result =
      document
        .getElementById(
          "result-" + id
        )
        .value;


    const pnlInput =
      document
        .getElementById(
          "pnl-" + id
        )
        .value;


    if (
      pnlInput === ""
    ) {

      alert(
        "請輸入實際盈虧"
      );

      return;

    }


    const trade =
      trades.find(
        trade =>
          trade.id === id
      );


    if (!trade) {
      return;
    }


    trade.status =
      "CLOSED";


    trade.result =
      result;


    trade.pnl =
      Number(
        pnlInput
      );


    settlingId =
      null;


    saveStorage();

    render();

  }


  function reopenTrade(id) {

    const trade =
      trades.find(
        trade =>
          trade.id === id
      );


    if (!trade) {
      return;
    }


    trade.status =
      "OPEN";

    trade.result =
      null;

    trade.pnl =
      null;


    saveStorage();

    render();

  }


  function deleteTrade(id) {

    if (
      !confirm(
        "確定刪除這筆交易？"
      )
    ) {

      return;

    }


    trades =
      trades.filter(
        trade =>
          trade.id !== id
      );


    saveStorage();

    render();

  }


  /* =========================
     卡片
  ========================= */

  function createTradeCard(
    trade
  ) {

    const isOpen =
      trade.status !==
      "CLOSED";


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "trade-card";


    const resultClass =
      isOpen
        ? "open"
        : Number(
            trade.pnl
          ) >= 0
            ? "win"
            : "loss";


    const resultText =
      isOpen
        ? "未結束"
        : escapeHTML(
            trade.result
          );


    card.innerHTML = `

      <div class="
        trade-title-row
      ">

        <span class="symbol">
          ${escapeHTML(
            trade.symbol
          )}
        </span>


        <span
          class="
            side
            ${
              trade.side ===
              "LONG"
                ? "long"
                : "short"
            }
          "
        >
          ${escapeHTML(
            trade.side
          )}
        </span>


        <span
          class="
            status
            ${resultClass}
          "
        >
          ${resultText}
        </span>


        ${
          trade.source ===
          "BINGX"
            ? `
              <span
                style="
                  font-size:9px;
                  color:#8fa0ff;
                "
              >
                BingX
              </span>
            `
            : ""
        }

      </div>


      <div class="
        entry-line
      ">
        Entry
        ${formatNumber(
          trade.entry
        )}

        ${
          trade.leverage
            ? " · " +
              trade.leverage +
              "x"
            : ""
        }
      </div>


      <div class="
        compact-data
      ">

        <div class="
          compact-item
        ">

          <span class="
            compact-label
          ">
            SL
          </span>

          <span class="
            compact-value
          ">
            ${formatNumber(
              trade.sl
            )}
          </span>

        </div>


        <div class="
          compact-item
        ">

          <span class="
            compact-label
          ">
            TP1
          </span>

          <span class="
            compact-value
          ">
            ${formatNumber(
              trade.tp1
            )}
          </span>

        </div>


        <div class="
          compact-item
        ">

          <span class="
            compact-label
          ">
            FTP
          </span>

          <span class="
            compact-value
          ">
            ${formatNumber(
              trade.ftp
            )}
          </span>

        </div>


        <div class="
          compact-item
        ">

          <span class="
            compact-label
          ">
            RR
          </span>

          <span class="
            compact-value
          ">
            ${formatRR(
              trade.rrFTP
            )}
          </span>

        </div>

      </div>


      ${
        trade.note
          ? `
            <div class="
              card-extra
            ">
              ${escapeHTML(
                trade.note
              )}
            </div>
          `
          : ""
      }


      ${
        !isOpen
          ? `
            <div
              class="
                pnl
                ${
                  Number(
                    trade.pnl
                  ) >= 0
                    ? "positive"
                    : "negative"
                }
              "
            >
              ${formatPnL(
                trade.pnl
              )}
            </div>
          `
          : ""
      }


      ${
        isOpen
          ? openCardActions(
              trade
            )
          : closedCardActions(
              trade
            )
      }

    `;


    return card;

  }


  function openCardActions(
    trade
  ) {

    const opened =
      settlingId ===
      trade.id;


    return `

      <div class="
        card-actions
      ">

        <button
          class="primary"
          onclick="
            toggleSettle(
              ${trade.id}
            )
          "
        >
          結算
        </button>


        <button
          class="secondary"
          onclick="
            editTrade(
              ${trade.id}
            )
          "
        >
          編輯
        </button>

      </div>


      <div
        class="
          settle-area
          ${
            opened
              ? "open"
              : ""
          }
        "
      >

        <div class="
          settle-grid
        ">

          <div class="field">

            <label>
              結果
            </label>

            <select
              id="
                result-${trade.id}
              "
            >

              <option value="TP1">
                TP1
              </option>

              <option value="TP2">
                TP2
              </option>

              <option value="FTP">
                FTP
              </option>

              <option value="SL">
                SL
              </option>

              <option value="MANUAL">
                手動
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              實際 PNL
            </label>

            <input
              id="
                pnl-${trade.id}
              "
              type="number"
              step="any"
            >

          </div>

        </div>


        <div class="
          settle-actions
        ">

          <button
            class="primary"
            onclick="
              settleTrade(
                ${trade.id}
              )
            "
          >
            完成
          </button>


          <button
            class="secondary"
            onclick="
              toggleSettle(
                ${trade.id}
              )
            "
          >
            取消
          </button>

        </div>

      </div>

    `;

  }


  function closedCardActions(
    trade
  ) {

    return `

      <div class="
        card-actions
        three
      ">

        <button
          class="secondary"
          onclick="
            editTrade(
              ${trade.id}
            )
          "
        >
          編輯
        </button>


        <button
          class="secondary"
          onclick="
            reopenTrade(
              ${trade.id}
            )
          "
        >
          重開
        </button>


        <button
          class="danger"
          onclick="
            deleteTrade(
              ${trade.id}
            )
          "
        >
          刪除
        </button>

      </div>

    `;

  }


  /* =========================
     Render
  ========================= */

  function render() {

    const openContainer =
      document
        .getElementById(
          "openTrades"
        );


    const closedContainer =
      document
        .getElementById(
          "closedTrades"
        );


    openContainer.innerHTML =
      "";


    closedContainer.innerHTML =
      "";


    const openTrades =
      trades.filter(
        trade =>
          trade.status !==
          "CLOSED"
      );


    const closedTrades =
      trades.filter(
        trade =>
          trade.status ===
          "CLOSED"
      );


    if (
      openTrades.length === 0
    ) {

      openContainer.innerHTML = `
        <div class="empty">
          目前沒有未結束交易
        </div>
      `;

    } else {

      openTrades.forEach(
        trade => {

          openContainer
            .appendChild(
              createTradeCard(
                trade
              )
            );

        }
      );

    }


    if (
      closedTrades.length === 0
    ) {

      closedContainer.innerHTML = `
        <div class="empty">
          尚無已結束交易
        </div>
      `;

    } else {

      closedTrades.forEach(
        trade => {

          closedContainer
            .appendChild(
              createTradeCard(
                trade
              )
            );

        }
      );

    }


    renderStats();

  }


  function renderStats() {

    const closed =
      trades.filter(
        trade =>
          trade.status ===
          "CLOSED"
      );


    const wins =
      closed.filter(
        trade =>
          Number(
            trade.pnl
          ) > 0
      );


    const totalPnL =
      closed.reduce(
        function(
          total,
          trade
        ) {

          return (
            total +
            Number(
              trade.pnl || 0
            )
          );

        },
        0
      );


    const winRate =
      closed.length
        ? (
            wins.length /
            closed.length *
            100
          ).toFixed(1)
        : null;


    const pnl =
      document
        .getElementById(
          "totalPnL"
        );


    pnl.textContent =
      (
        totalPnL > 0
          ? "+"
          : ""
      ) +
      totalPnL.toFixed(2) +
      " U";


    pnl.className =
      "stat-value " +
      (
        totalPnL > 0
          ? "positive"
          : totalPnL < 0
            ? "negative"
            : ""
      );


    document
      .getElementById(
        "winRate"
      )
      .textContent =
        winRate === null
          ? "-"
          : winRate + "%";


    document
      .getElementById(
        "totalTrades"
      )
      .textContent =
        trades.length;

  }


  render();

</script>

</body>
